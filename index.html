<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌈日本の心の宝地図🌈</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    header {
      padding: 12px;
      text-align: center;
      background: #e9f8ef;
      color: #256b3b;
      font-weight: bold;
      font-size: 20px;
    }

    #map {
      height: calc(100vh - 52px);
      width: 100%;
    }

    .legend {
  background: white;
  padding: 8px 10px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  font-size: 12px;
  line-height: 1.5;
}
.leaflet-bottom {
  bottom: 40px;
}
    .legend-title {
      font-weight: bold;
      margin-bottom: 4px;
      color: #256b3b;
    }
  </style>
</head>

<body>
  <header>🌏地球大好きっ子クラブ🌎<br>🍀日本の心の宝地図🌈</header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', {
  zoomControl: false
}).setView([37.8, 138.5], 5);
L.control.zoom({
  position: 'bottomleft'
}).addTo(map);
    
  L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);
    const redIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34]
    });

    const blueIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34]
    });

    const orangeIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34]
    });

    L.marker([36.6200, 138.5969], { icon: redIcon })
      .addTo(map)
      .bindPopup('♨️ 草津温泉<br>日本を代表する名湯');

    L.marker([35.3606, 138.7274], { icon: blueIcon })
      .addTo(map)
      .bindPopup('🗻 富士山<br>日本一の絶景');

    L.marker([35.0956, 138.8635], { icon: orangeIcon })
      .addTo(map)
      .bindPopup('🍴 沼津港<br>新鮮な海鮮グルメ');

   const legend = L.control({ position: 'topleft' });

    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `
        <div class="legend-title">📖 カテゴリ</div>
        🔴 温泉<br>
        🔵 絶景<br>
        🟢 風景<br>
        🟠 グルメ<br>
        🟣 レジャー<br>
        🟡 自然農<br>
        ⛩️ 神社・伝統<br>
        🐾 動物<br>
        🎆 イベント<br>
        🌈 幸せシェア
      `;
      return div;
    };

    legend.addTo(map);
  </script>
</body>
</html>
