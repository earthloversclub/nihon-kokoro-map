<script>

const SITE_PASSWORD = "yumemigaoka";

function openTreasureMap() {

document.getElementById("passwordGate").style.display = "none";

setTimeout(() => {
map.invalidateSize();
}, 800);
}

setTimeout(() => {

    btn.style.display = "none";
  }
}, 0);
  
  const urlParams = new URLSearchParams(window.location.search);
  const isReturn = urlParams.get("return") === "true";

  if (isReturn) {
    localStorage.setItem("treasureMapAccess", "ok");
    localStorage.removeItem("fromReturn");

    document.getElementById("passwordGate").style.display = "none";
    document.getElementById("titleSplash").style.display = "none";

    openTreasureMap();

    window.history.replaceState({}, document.title, window.location.pathname);
    return;
  }

  const fromReturn = localStorage.getItem("fromReturn");

  if (fromReturn) {
    localStorage.removeItem("fromReturn");
    document.getElementById("passwordGate").style.display = "none";
    document.getElementById("titleSplash").style.display = "none";
    openTreasureMap();
    return;
  }

  if (localStorage.getItem("treasureMapAccess") === "ok") {
    document.getElementById("titleSplash").style.display = "none";
    openTreasureMap();
    return;

  document.getElementById("passwordGate").style.display = "flex";

});

function checkPassword() {
const input = document.getElementById("passwordInput").value.trim();

if (input === SITE_PASSWORD) {
openTreasureMap();
} else {
document.getElementById("passwordError").textContent = "合言葉が違います";
}
}
const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v40CNsKzTus67itmVJ4NY45nYz_QLW400WRXj9XjDkM/pub?output=csv";
const heartCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v40CNsKzTus67itmVJ4NY45nYz_QLW400WRXj9XjDkM/pub?gid=247430186&single=true&output=csv";
const MY_POSTER_NAME = "ちえちゃん";
  
const map = L.map('map', { zoomControl: false }).setView([37.8, 138.5], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '&copy; OpenStreetMap'
}).addTo(map);

map.on("zoomstart", () => {
  if (isResettingMap) return;

});

map.on("dragstart", () => {
  if (isResettingMap) return;
  document.body.classList.add("mapCleanMode");

});

  document.body.classList.remove("mapCleanMode");
}

document.getElementById("resetMapViewBtn").addEventListener("click", () => {
  isResettingMap = true;

map.closePopup();

  map.setView([37.8, 138.5], 5);

  setTimeout(() => {
    hideCleanMode();
    isResettingMap = false;
  }, 400);
});

function icon(color) {
return new L.Icon({
iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
iconSize: [25, 41],
iconAnchor: [12, 41],
popupAnchor: [1, -34]
});
}
const markers = [];
const prefectureCounts = {};
const prefectureThanks = {};
const allSpots = [];
const activeCategories = new Set([
"温泉・宿泊",
"自然・絶景",
"グルメ・特産品",
"神社仏閣・歴史",
"自然農",
"イベント・体験",
"人・活動・想い"
]);
const icons = {
"温泉・宿泊": icon("red"),
"自然・絶景": icon("blue"),
"グルメ・特産品": icon("orange"),
"神社仏閣・歴史": icon("violet"),
"自然農": icon("green"),
"イベント・体験": icon("gold"),
"人・活動・想い": new L.Icon({
iconUrl: "https://drive.google.com/thumbnail?id=1qoqhK29AJXjMBlTIFJJT79o168Pstuja&sz=w1000",
iconSize: [58, 58],
iconAnchor: [21, 42],
popupAnchor: [0, -32],
className: ""
})
};

function parseCSV(text) {
const rows = [];
let row = [], cell = '', quote = false;

for (let i = 0; i < text.length; i++) {
const c = text[i];
const next = text[i + 1];

if (c === '"' && quote && next === '"') {
cell += '"';
i++;
} else if (c === '"') {
quote = !quote;
} else if (c === ',' && !quote) {
row.push(cell);
cell = '';
} else if ((c === '\n' || c === '\r') && !quote) {
if (cell || row.length) {
row.push(cell);
rows.push(row);
row = [];
cell = '';
}
if (c === '\r' && next === '\n') i++;
} else {
cell += c;
}
}

if (cell || row.length) {
row.push(cell);
rows.push(row);
}

return rows;
}

fetch(sheetUrl + "&t=" + Date.now())
.then(response => response.text())
.then(csv => {
const rows = parseCSV(csv);
const headers = rows[0];

rows.slice(1).forEach(row => {
const data = {};
headers.forEach((h, i) => data[h] = row[i]);

if (!data["緯度"] || !data["経度"]) return;

const lat = Number(data["緯度"]);
const lng = Number(data["経度"]);
const category = data["カテゴリ"];
const prefecture = data["都道府県"];

if (prefecture) {
prefectureCounts[prefecture] =
(prefectureCounts[prefecture] || 0) + 1;

prefectureThanks[prefecture] =
(prefectureThanks[prefecture] || 0) + (Number(data["ありがとう数"]) || 0);
}
const markerIcon = icons[category] || icon("blue");

let popup = `
<div style="font-size:17px; line-height:1.45;">

  <div style="font-size:21px; line-height:1.2; font-weight:bold; margin-bottom:2px;">
    ${data["タイトル"] || data["名前"]}
  </div>

  ${category ? `<div style="font-size:17px; font-weight:bold;">カテゴリ：${category}</div>` : ""}

  ${data["説明"]
  ? `<div style="margin-top:8px;">${data["説明"].replace(/\n/g, "<br>")}</div>`
  : ""}

  ${data["投稿者"] ? `<div style="font-size:16px; margin-top:8px;">投稿者：${data["投稿者"]}</div>` : ""}

  ${data["投稿日"] ? `<div style="font-size:16px;">投稿日：${data["投稿日"]}</div>` : ""}

</div>

<button class="thanks-btn" data-spot-id="${data["ID"]}" onclick="sendThanks(this, '${data["ID"]}')">
  ありがとうを届ける🌸
</button>

<div class="thanks-hint">
  🌸 あなたの1輪が、日本を育てます
</div>

<div class="thanks-message-wrapper">
  <div class="thanks-message"></div>
</div>
`;

function convertDriveImageUrl(url) {
if (!url) return "";

const match = url.match(/\/d\/([^/]+)/);

if (match && match[1]) {
return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
}

return url;
}

const imageUrls = [];

if (data["画像"] && data["画像"] !== data["動画"]) {
imageUrls.push(convertDriveImageUrl(data["画像"]));
}

if (data["画像2"] && data["画像2"] !== data["動画"]) {
imageUrls.push(convertDriveImageUrl(data["画像2"]));
}

if (data["画像3"] && data["画像3"] !== data["動画"]) {
imageUrls.push(convertDriveImageUrl(data["画像3"]));
}

if (data["画像4"] && data["画像4"] !== data["動画"]) {
imageUrls.push(convertDriveImageUrl(data["画像4"]));
}

if (imageUrls.length > 0 || data["動画"]) {
const mediaCount = imageUrls.length + (data["動画"] ? 1 : 0);

popup += mediaCount === 1
? `<div class="image-carousel media-count-1">`
: `<div class="image-carousel multi-images media-count-${mediaCount}">`;

const mediaItems = imageUrls.map(url => ({
type: "image",
url: url
}));

if (data["動画"]) {
mediaItems.push({
type: "video",
url: data["動画"]
});
}

const safeMediaItems = JSON.stringify(mediaItems).replace(/'/g, "&apos;");

imageUrls.forEach((url, index) => {
popup += `
<img
class="popup-img"
src="${url}"
onclick='openMediaModal(${safeMediaItems}, ${index})'
>
`;
});

if (data["動画"]) {
const videoThumbnail = data["動画"]
.replace("/video/upload/", "/video/upload/so_5/")
.replace(".mp4", ".jpg");

popup += `
<div class="popup-img video-thumb" onclick='openMediaModal(${safeMediaItems}, ${mediaItems.length - 1})'>
  <img class="video-thumb-img" src="${videoThumbnail}">
  <div class="video-play-mark">▶</div>
</div>
`;
}

popup += `</div>`;
}

function isWithin10Minutes(timeText) {
if (!timeText) return false;

const eventTime = new Date(timeText.replace(/\//g, "-")).getTime();
const nowTime = Date.now();

return nowTime - eventTime <= 30 * 60 * 1000;
}

let angelEmoji = "";

if (category === "人・活動・想い") {
if (isWithin10Minutes(data["神降臨時刻"])) {
angelEmoji = "🌈👑 神降臨 👑🌈<br><span style='font-size:10px;'>✨ THANK YOU 3000 ✨</span>";
} else if (isWithin10Minutes(data["大天使降臨時刻"])) {
angelEmoji = "🪽👼大天使降臨👼🪽";
} else if (isWithin10Minutes(data["天使降臨時刻"])) {
angelEmoji = "👼天使降臨";
}
}

const popupClassMap = {
  "温泉・宿泊": "popup-onsen",
  "自然・絶景": "popup-nature",
  "グルメ・特産品": "popup-gourmet",
  "神社仏閣・歴史": "popup-shrine",
  "自然農": "popup-farm",
  "イベント・体験": "popup-event",
  "人・活動・想い": "popup-rainbow"
};

const popupClass = popupClassMap[category] || "popup-default";

let marker;

if (angelEmoji) {
const specialIcon = L.divIcon({
html: `
<div class="special-pin-wrap">
<div class="angel-effect">${angelEmoji}</div>
<img src="${markerIcon.options.iconUrl}" style="width:${markerIcon.options.iconSize[0]}px; height:${markerIcon.options.iconSize[1]}px;">
</div>
`,
className: "",
iconSize: [90, 80],
iconAnchor: [45, 75],
popupAnchor: [0, -75]
});

marker = L.marker([lat, lng], { icon: specialIcon })
.bindPopup(popup, {
  minWidth: 230,
  maxWidth: 280,
  className: popupClass
});

} else {
marker = L.marker([lat, lng], { icon: markerIcon })
.bindPopup(popup, {
  minWidth: 230,
  maxWidth: 280,
  className: popupClass
});
}

allSpots.push({
  title: data["タイトル"] || data["名前"],
  description: data["説明"],
  poster: data["投稿者"],
  prefecture: data["都道府県"],
  category: category,
  marker: marker
});

marker.category = category;

marker.addTo(map);
marker.on("popupopen", function(){
  document.getElementById("mapSwitchBox").style.visibility = "hidden";
});

marker.on("popupclose", function(){
  document.getElementById("mapSwitchBox").style.display = "flex";
});

markers.push(marker);

const totalPostsCountEl =
document.getElementById("totalPostsCount");

if (totalPostsCountEl) {
totalPostsCountEl.textContent =
markers.length + "件";
}

});

loadAchievement();
loadRanking();

});

totalPostsBox.onAdd = function () {

const isPC = window.innerWidth >= 768;

div.style.width = isPC ? "420px" : "330px";

div.innerHTML = `
<div style="text-align:center; position:relative; height:100%;">
<div id="totalPostsCount"
style="
position:absolute;
top:${isPC ? "135px" : "107px"};
left:50%;
transform:translateX(-50%);

text-shadow:
0 0 6px white,
0 0 12px white,
0 0 24px white;
">
0件
</div>
</div>
`;

return div;
};

totalPostsBox.addTo(map);
const legend = L.control({ position: 'topleft' });

legend.onAdd = function () {
const div = L.DomUtil.create('div', 'legend');

const isPC = window.innerWidth >= 768;

div.style.marginTop = isPC ? "-10px" : "-18px";
div.style.marginLeft = "-9px";
div.style.width = isPC ? "270px" : "235px";
div.style.height = isPC ? "345px" : "325px";
div.style.background = "url('images/category-frame.png') center center no-repeat";
div.style.backgroundSize = "100% 100%";
div.style.border = "none";
div.style.boxShadow = "none";

let modalItems = [];
let modalIndex = 0;
let modalScale = 1;
let modalTranslateX = 0;
let modalTranslateY = 0;

let touchStartX = 0;
let touchStartY = 0;
let lastTouchX = 0;
let lastTouchY = 0;
let lastTouchDistance = 0;

let isPinching = false;
let hasDraggedImage = false;

let isModalSwipeActive = false;
let modalSwipeDirection = 0;
const MODAL_SWIPE_THRESHOLD = 70;
const MODAL_SWIPE_DURATION = 220;

let isMouseDraggingImage = false;
let lastMouseX = 0;
let lastMouseY = 0;

function applyModalImageTransform() {
  const img = document.getElementById('modalImage');

  img.style.transform =
    `translate(${modalTranslateX}px, ${modalTranslateY}px) scale(${modalScale})`;
}

function resetModalZoom() {
  modalScale = 1;
  modalTranslateX = 0;
  modalTranslateY = 0;
  lastTouchDistance = 0;
  isPinching = false;
  hasDraggedImage = false;
  resetModalSwipeStage();
}

function getTouchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;

  return Math.sqrt(dx * dx + dy * dy);
}

function getModalNeighborIndex(direction) {
  let index = modalIndex + direction;

  if (index < 0) index = modalItems.length - 1;
  if (index >= modalItems.length) index = 0;

  return index;
}

function resetModalSwipeStage() {
  const stage = document.getElementById('modalSwipeStage');
  const current = document.getElementById('modalSwipeCurrent');
  const neighbor = document.getElementById('modalSwipeNeighbor');
  const img = document.getElementById('modalImage');

  if (!stage || !current || !neighbor || !img) return;

  stage.style.display = "none";
  current.src = "";
  neighbor.src = "";

  current.style.transition = "none";
  neighbor.style.transition = "none";

  current.style.transform = "translate(-50%, -50%)";
  neighbor.style.transform = "translate(-50%, -50%)";

  img.style.visibility = "visible";

  isModalSwipeActive = false;
  modalSwipeDirection = 0;
}

function moveModalSwipe(diffX) {
  const item = modalItems[modalIndex];
  const direction = diffX < 0 ? 1 : -1;
  const neighborItem = modalItems[getModalNeighborIndex(direction)];

  if (!item || item.type !== "image") return;
  if (!neighborItem || neighborItem.type !== "image") return;

  const stage = document.getElementById('modalSwipeStage');
  const current = document.getElementById('modalSwipeCurrent');
  const neighbor = document.getElementById('modalSwipeNeighbor');
  const img = document.getElementById('modalImage');

  if (!isModalSwipeActive || modalSwipeDirection !== direction) {
    modalSwipeDirection = direction;
    current.src = item.url;
    neighbor.src = neighborItem.url;
    stage.style.display = "block";
    img.style.visibility = "hidden";
  }

  isModalSwipeActive = true;

  const width = window.innerWidth;
  const neighborBaseX = direction === 1 ? width : -width;

  current.style.transition = "none";
  neighbor.style.transition = "none";

  current.style.transform =
    `translate(calc(-50% + ${diffX}px), -50%)`;

  neighbor.style.transform =
    `translate(calc(-50% + ${neighborBaseX + diffX}px), -50%)`;
}

function cancelModalSwipe() {
  const current = document.getElementById('modalSwipeCurrent');
  const neighbor = document.getElementById('modalSwipeNeighbor');

  const width = window.innerWidth;
  const neighborBaseX = modalSwipeDirection === 1 ? width : -width;

  current.style.transition = `transform ${MODAL_SWIPE_DURATION}ms ease`;
  neighbor.style.transition = `transform ${MODAL_SWIPE_DURATION}ms ease`;

  current.style.transform = "translate(-50%, -50%)";
  neighbor.style.transform =
    `translate(calc(-50% + ${neighborBaseX}px), -50%)`;

  setTimeout(() => {
    resetModalSwipeStage();
  }, MODAL_SWIPE_DURATION);
}

function completeModalSwipe() {
  const current = document.getElementById('modalSwipeCurrent');
  const neighbor = document.getElementById('modalSwipeNeighbor');

  const width = window.innerWidth;
  const currentEndX = modalSwipeDirection === 1 ? -width : width;

  current.style.transition = `transform ${MODAL_SWIPE_DURATION}ms ease`;
  neighbor.style.transition = `transform ${MODAL_SWIPE_DURATION}ms ease`;

  current.style.transform =
    `translate(calc(-50% + ${currentEndX}px), -50%)`;

  neighbor.style.transform = "translate(-50%, -50%)";

  setTimeout(() => {
    modalIndex = getModalNeighborIndex(modalSwipeDirection);
    renderModalItem(true);
  }, MODAL_SWIPE_DURATION);
}

function showModalImage(direction) {
if (modalItems.length === 0) return;

modalIndex += direction;

if (modalIndex < 0) {
modalIndex = modalItems.length - 1;
}

if (modalIndex >= modalItems.length) {
modalIndex = 0;
}

renderModalItem();
}

const imageModal = document.getElementById('imageModal');

imageModal.addEventListener('touchstart', function(e) {
  if (modalItems[modalIndex]?.type !== "image") return;

  if (e.touches.length === 2) {
    isPinching = true;
    lastTouchDistance = getTouchDistance(e.touches);
    resetModalSwipeStage();
    e.preventDefault();
    return;
  }

if (e.touches.length === 1) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  lastTouchX = touchStartX;
  lastTouchY = touchStartY;
  hasDraggedImage = false;

  if (modalScale === 1) {
    resetModalSwipeStage();
  }
}
}, { passive: false });

imageModal.addEventListener('touchmove', function(e) {
  if (modalItems[modalIndex]?.type !== "image") return;

  if (e.touches.length === 2) {
    const distance = getTouchDistance(e.touches);

    if (lastTouchDistance > 0) {
      const zoomChange = distance / lastTouchDistance;

      modalScale *= zoomChange;
      modalScale = Math.max(1, Math.min(modalScale, 4));

      if (modalScale === 1) {
        modalTranslateX = 0;
        modalTranslateY = 0;
      }

      applyModalImageTransform();
    }

    lastTouchDistance = distance;
    isPinching = true;
    resetModalSwipeStage();
    e.preventDefault();
    return;
  }

if (e.touches.length === 1 && modalScale > 1) {
  const currentX = e.touches[0].clientX;
  const currentY = e.touches[0].clientY;

  modalTranslateX += currentX - lastTouchX;
  modalTranslateY += currentY - lastTouchY;

  lastTouchX = currentX;
  lastTouchY = currentY;
  hasDraggedImage = true;

  applyModalImageTransform();
  e.preventDefault();
  return;
}

if (e.touches.length === 1 && modalScale === 1) {
  const currentX = e.touches[0].clientX;
  const currentY = e.touches[0].clientY;
  const diffX = currentX - touchStartX;
  const diffY = currentY - touchStartY;

  if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 8) {
    moveModalSwipe(diffX);
    e.preventDefault();
    return;
  }
}
}, { passive: false });

imageModal.addEventListener('touchend', function(e) {
  if (modalItems[modalIndex]?.type !== "image") return;

  if (e.touches.length === 0) {
    lastTouchDistance = 0;
  }

  if (isPinching) {
    isPinching = false;
    resetModalSwipeStage();
    return;
  }

  if (modalScale > 1 || hasDraggedImage) {
    return;
  }

  const touchEndX = e.changedTouches[0].clientX;
  const diffX = touchEndX - touchStartX;

  if (!isModalSwipeActive) {
    if (Math.abs(diffX) < 50) return;

    if (diffX > 0) {
      showModalImage(-1);
    } else {
      showModalImage(1);
    }
    return;
  }

  if (Math.abs(diffX) < MODAL_SWIPE_THRESHOLD) {
    cancelModalSwipe();
    return;
  }

  completeModalSwipe();
}, { passive: true });
imageModal.addEventListener('wheel', function(e) {
  if (modalItems[modalIndex]?.type !== "image") return;

  resetModalSwipeStage();
  e.preventDefault();

  modalScale += -e.deltaY * 0.0015;
  modalScale = Math.max(1, Math.min(modalScale, 4));

  if (modalScale === 1) {
    modalTranslateX = 0;
    modalTranslateY = 0;
  }

  applyModalImageTransform();
}, { passive: false });

document.getElementById('modalImage').addEventListener('dragstart', function(e) {
  e.preventDefault();
});

imageModal.addEventListener('mousedown', function(e) {
  if (modalItems[modalIndex]?.type !== "image") return;
  if (modalScale <= 1) return;
  if (e.target.id !== "modalImage") return;

  resetModalSwipeStage();

  isMouseDraggingImage = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;

  e.preventDefault();
});

document.addEventListener('mousemove', function(e) {
  if (!isMouseDraggingImage) return;

  modalTranslateX += e.clientX - lastMouseX;
  modalTranslateY += e.clientY - lastMouseY;

  lastMouseX = e.clientX;
  lastMouseY = e.clientY;

  applyModalImageTransform();
});

document.addEventListener('mouseup', function() {
  isMouseDraggingImage = false;
});

function getMyLevelInfo(postCount, thanksCount) {
  const point = postCount * 10 + thanksCount * 2;

  let level = Math.floor(Math.sqrt(point)) + 1;

  if (level > 99) {
    level = 99;
  }

  let title = "旅人";

  if (level >= 90) {
    title = "地球愛の神";
  } else if (level >= 80) {
    title = "奇跡の光使";
  } else if (level >= 70) {
    title = "祝福の女神";
  } else if (level >= 60) {
    title = "光の守護者";
  } else if (level >= 50) {
    title = "愛の天使";
  } else if (level >= 40) {
    title = "光の癒し手";
  } else if (level >= 30) {
    title = "幸せの紡ぎ手";
  } else if (level >= 20) {
    title = "虹の使者";
  } else if (level >= 10) {
    title = "吟遊詩人";
  }

  return {
    point: point,
    level: level,
    title: title
  };
}

function addPosterCounts(rows, counts) {
  const headers = rows[0];

  rows.slice(1).forEach(row => {
    const data = {};

    headers.forEach((h, i) => {
      const key = h.replace(/\s/g, "").trim();
      data[key] = row[i];
    });

    const name = (data["投稿者"] || "").trim();

    if (!name) return;
    if (name === "未入力") return;
    if (name === "匿名") return;

    counts[name] = (counts[name] || 0) + 1;
  });
}

function getThanksColor(count) {
if (count === 0) return "#dddddd";
if (count <= 100) return "#ffffff";
if (count <= 200) return "#aeefff";
if (count <= 300) return "#4da3ff";
if (count <= 400) return "#66cc66";
if (count <= 500) return "#fff176";
if (count <= 600) return "#ff9800";
if (count <= 700) return "#ff8acb";
return "#ff3333";
}

function showFlowerConfetti(level) {
const flowers = ["🌸", "🌼", "🌷", "🌺", "🪻", "🌻"];
const count = level === "max" ? 80 : 35;
const size = level === "max" ? 34 : 26;
const duration = level === "max" ? 2500 : 1600;

for (let i = 0; i < count; i++) {
const flower = document.createElement("div");
flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];

flower.style.position = "fixed";
flower.style.left = Math.random() * window.innerWidth + "px";
flower.style.top = "-40px";
flower.style.fontSize = size + "px";
flower.style.pointerEvents = "none";
flower.style.zIndex = "9999";

document.body.appendChild(flower);

flower.animate(
[
{ transform: "translateY(0px) rotate(0deg)", opacity: 1 },
{ transform: "translateY(" + (window.innerHeight + 100) + "px) rotate(720deg)", opacity: 0 }
],
{
duration: duration + Math.random() * 800,
easing: "ease-in"
}
);

setTimeout(() => flower.remove(), duration + 1000);
}
}

function searchPlace() {

  const keyword = document
    .getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  const resultBox = document.getElementById("searchResultsBox");

  if (!keyword) {
    resultBox.style.display = "none";
    resultBox.innerHTML = "";
    return;
  }

  const results = allSpots.filter(spot => {

    return [
      spot.title,
      spot.description,
      spot.poster,
      spot.prefecture,
      spot.category
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase()
    .includes(keyword);

  });

  if (results.length === 0) {
    resultBox.style.display = "none";
    resultBox.innerHTML = "";
    alert("見つかりませんでした");
    return;
  }

  if (results.length === 1) {
    const found = results[0];
    resultBox.style.display = "none";
    resultBox.innerHTML = "";

    map.setView(found.marker.getLatLng(), 12);
    found.marker.openPopup();
    return;
  }

resultBox.innerHTML = `
    <div style="position:relative; font-weight:900; color:#256b3b; margin-bottom:6px; padding-right:28px;">
      検索結果：${results.length}件
      <button
        type="button"
        onclick="closeSearchResults()"
        style="position:absolute; top:-4px; right:0; border:none; background:transparent; font-size:18px; font-weight:900; cursor:pointer;"
      >×</button>
    </div>

    ${results.slice(0, 10).map((spot, index) => `
      <div class="searchResultItem" onclick="openSearchResult(${index})">
        <div class="searchResultTitle">${spot.title || "タイトルなし"}</div>
        <div class="searchResultMeta">
          ${spot.prefecture || ""}｜${spot.category || ""}<br>
          投稿者：${spot.poster || "未入力"}
        </div>
      </div>
    `).join("")}
    ${results.length > 10 ? `
      <div style="padding:8px; color:#777;">
        ほか${results.length - 10}件あります<br>
        キーワードを追加すると絞り込めます
      </div>
    ` : ""}
  `;

  window.currentSearchResults = results.slice(0, 10);
  resultBox.style.display = "block";

}

function openSearchResult(index) {
  const spot = window.currentSearchResults[index];
  const resultBox = document.getElementById("searchResultsBox");

  if (!spot) return;

  resultBox.style.display = "none";
  resultBox.innerHTML = "";

  map.setView(spot.marker.getLatLng(), 12);
  spot.marker.openPopup();
}

function closeSearchResults() {
  const resultBox = document.getElementById("searchResultsBox");

  if (!resultBox) return;

  resultBox.style.display = "none";
  resultBox.innerHTML = "";
}
