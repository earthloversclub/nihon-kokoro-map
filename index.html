<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌈日本の心の宝地図🌈</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
  body { margin: 0; font-family: sans-serif; }
    
  .image-modal {
  display: none;
  position: fixed;
  z-index: 9999;
  inset: 0;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}

.image-modal img {
  max-width: 92%;
  max-height: 90%;
  border-radius: 10px;
}

.image-modal-close {
  position: fixed;
  top: 15px;
  right: 20px;
  color: white;
  font-size: 36px;
  font-weight: bold;
  cursor: pointer;
}

    header {
      padding: 12px;
      text-align: center;
      background: #e9f8ef;
      color: #256b3b;
      font-weight: bold;
      font-size: 20px;
    }
    
header span {
  display: inline;
}

@media (max-width: 600px) {
  header span {
    display: block;
  }
}
    #map {
      height: calc(100vh - 52px);
      width: 100%;
    }

    .legend {
      background: white;
      padding: 8px 10px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 12px;
      line-height: 1.5;
    }

    .legend-title {
      font-weight: bold;
      margin-bottom: 4px;
      color: #256b3b;
    }

    .popup-img {
      width: 180px;
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
      cursor: pointer;
    }

    .image-carousel {
  margin-top: 8px;
  text-align: center;
}

.carousel-buttons {
  margin-top: 5px;
}

.carousel-buttons button {
  border: none;
  border-radius: 50%;
  background: #e8f5ee;
  color: #256b3b;
  margin: 0 3px;
  cursor: pointer;
}
    
.thanks-btn {
  margin-top: 8px;
  padding: 6px 10px;
  border: none;
  border-radius: 20px;
  background: #ffe4b3;
  color: #b86a00;
  cursor: pointer;
  font-size: 14px;
}

.thanks-message {
  display: none;
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 20px;
  background: #ffd6ec;
  color: #b24a68;
  font-size: 14px;
}

  #viewButtons {
  text-align: center;
  padding: 8px;
  background: #f8fff9;
}

#viewButtons button {
  padding: 8px 14px;
  margin: 0 5px;
  border: none;
  border-radius: 20px;
  background: #dff3e5;
  color: #256b3b;
  cursor: pointer;
  font-size: 14px;
}

#mapSwitchBox {
  position: absolute;
  bottom: 75px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  background: white;
  padding: 8px 10px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  display: flex;
  gap: 8px;
  white-space: nowrap;
}

#mapSwitchBox button {
  font-size: 18px;
  padding: 6px 10px;
}
    
#searchBox {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  background: white;
  padding: 8px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

#searchInput {
  width: 180px;
  padding: 5px;
}

  #growthMap {
  padding: 30px;
  text-align: center;
}
    
#japanGrowthMap {
  width: 100%;
  max-width: 700px;
  height: 520px;
  margin: 25px auto 0;
}
#thanksFlowerBox {
  display: inline-block;
  background: #fff4f8;
  border-radius: 18px;
  padding: 16px 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  color: #b24a68;
}

#achievementBox {
  display: inline-block;
  background: #eef9ff;
  border-radius: 18px;
  padding: 16px 24px;
  margin-top: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
    
#missingPrefecturesBox {
   display: block;
  background: #f4fff0;
  border-radius: 18px;
  padding: 16px 24px;
  margin-top: 15px;
    margin-left: auto;
  margin-right: auto;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  max-width: 700px;
}

.missing-title {
  font-size: 16px;
  font-weight: bold;
  color: #4d8c2f;
}

#missingPrefectures {
  margin-top: 10px;

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 6px;

  text-align: left;

  max-width: 500px;
}
.achievement-title {
  font-size: 16px;
  font-weight: bold;
  color: #2c6ca8;
}

.achievement-count {
  margin-top: 8px;
  font-size: 24px;
  font-weight: bold;
}

.achievement-percent {
  margin-top: 4px;
  font-size: 18px;
}
  display: inline-block;
  background: #fff4f8;
  border-radius: 18px;
  padding: 16px 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  color: #b24a68;
}

.thanks-flower-title {
  font-size: 16px;
  font-weight: bold;
}

.thanks-flower-count {
  margin-top: 8px;
  font-size: 28px;
  font-weight: bold;
}
    
  </style>
</head>

<body>
<header>
  <span>🌎地球大好きっ子クラブ🌎</span>
  <span>🌈日本の心の宝地図🌈</span>
</header>

<div id="mapSwitchBox">
  <button onclick="showMapA()">🗺 宝物地図</button>
  <button onclick="showMapB()">🌸 成長地図</button>
</div>
  
<div id="searchBox">
  <input type="text" id="searchInput" placeholder="地名やタイトルを検索">
  <button onclick="searchPlace()">検索</button>
</div>

  <div id="map"></div>
<div id="growthMap" style="display:none;">
  <h2>🌸 成長地図 🌸</h2>

  <div id="thanksFlowerBox">
    <div class="thanks-flower-title">🌸 みんなから届いたありがとうの花</div>
    <div class="thanks-flower-count">
      <span id="thanksTotal">読み込み中...</span> 輪
    </div>
  </div>

  <div id="achievementBox">
  <div class="achievement-title">🌈 全国達成率</div>

  <div class="achievement-count">
    <span id="achievementCount">0 / 47県</span>
  </div>

  <div class="achievement-percent">
    <span id="achievementPercent">0%</span>
  </div>
</div>
  
 <div id="japanGrowthMap"></div>
</div>
  
<div id="imageModal" class="image-modal">
  <span class="image-modal-close" onclick="closeImageModal()">×</span>
  <img id="modalImage" src="">
</div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v40CNsKzTus67itmVJ4NY45nYz_QLW400WRXj9XjDkM/pub?output=csv";

    const map = L.map('map', { zoomControl: false }).setView([37.8, 138.5], 5);

    L.control.zoom({ position: 'bottomleft' }).addTo(map);
    
setTimeout(() => {
  document.querySelector('.leaflet-control-zoom').style.marginBottom = '60px';
}, 500);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    function icon(color) {
      return new L.Icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
      });
    }
const markers = [];
    const prefectureCounts = {};
    const allSpots = [];
    let japanGrowthMapInstance = null;
const activeCategories = new Set([
  "温泉",
  "絶景",
  "風景",
  "グルメ",
  "レジャー",
  "自然農",
  "神社・伝統",
  "動物",
  "イベント",
  "幸せシェア"
]);
    
    const icons = {
      "温泉": icon("red"),
      "絶景": icon("blue"),
      "風景": icon("green"),
      "グルメ": icon("orange"),
      "レジャー": icon("violet"),
      "自然農": icon("yellow"),
      "神社・伝統": icon("gold"),
      "動物": icon("grey"),
      "イベント": icon("black"),
"幸せシェア": new L.Icon({
  iconUrl: "https://drive.google.com/thumbnail?id=1-LOYbEjRCdi3b-0nN0aoXoTLRE9bPCXI&sz=w1000",

  iconSize: [55, 55],
  iconAnchor: [27, 55],
  popupAnchor: [0, -35]
})
    };

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = '', quote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quote && next === '"') {
          cell += '"';
          i++;
        } else if (c === '"') {
          quote = !quote;
        } else if (c === ',' && !quote) {
          row.push(cell);
          cell = '';
        } else if ((c === '\n' || c === '\r') && !quote) {
          if (cell || row.length) {
            row.push(cell);
            rows.push(row);
            row = [];
            cell = '';
          }
          if (c === '\r' && next === '\n') i++;
        } else {
          cell += c;
        }
      }

      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
      }

      return rows;
    }

    fetch(sheetUrl)
      .then(response => response.text())
      .then(csv => {
        const rows = parseCSV(csv);
        const headers = rows[0];

        rows.slice(1).forEach(row => {
          const data = {};
          headers.forEach((h, i) => data[h] = row[i]);

          if (!data["緯度"] || !data["経度"]) return;

          const lat = Number(data["緯度"]);
          const lng = Number(data["経度"]);
          const category = data["カテゴリ"];
          const prefecture = data["都道府県"];

if (prefecture) {
  prefectureCounts[prefecture] =
    (prefectureCounts[prefecture] || 0) + 1;
}
          const markerIcon = icons[category] || icon("blue");

          let popup = `
  <strong>${data["タイトル"] || data["名前"]}</strong><br>
  ${category ? "カテゴリ：" + category + "<br>" : ""}
  ${data["説明"] ? data["説明"] + "<br>" : ""}
  ${data["投稿者"] ? "投稿者：" + data["投稿者"] + "<br>" : ""}
  ${data["投稿日"] ? "投稿日：" + data["投稿日"] + "<br>" : ""}

<button class="thanks-btn" data-spot-id="${data["ID"]}" onclick="sendThanks(this, '${data["ID"]}')">
  ありがとうを届ける🌸
</button>
<div class="thanks-message"></div>
`;

          function convertDriveImageUrl(url) {
  if (!url) return "";

  const match = url.match(/\/d\/([^/]+)/);

  if (match && match[1]) {
    return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
  }

  return url;
}

const imageUrls = [];

if (data["画像"]) {
  imageUrls.push(convertDriveImageUrl(data["画像"]));
}

if (data["画像2"]) {
  imageUrls.push(convertDriveImageUrl(data["画像2"]));
}

if (data["画像3"]) {
  imageUrls.push(convertDriveImageUrl(data["画像3"]));
}

if (data["画像4"]) {
  imageUrls.push(convertDriveImageUrl(data["画像4"]));
}

if (imageUrls.length > 0) {
  const spotId = data["ID"];

  popup += `
    <div class="image-carousel">
      <img
        class="popup-img"
        id="carousel-${spotId}"
        src="${imageUrls[0]}"
        onclick="openImageModal(this.src)"
      >
  `;

if (imageUrls.length > 1) {

  popup += `<div class="carousel-buttons">`;

  imageUrls.forEach((url, index) => {
    popup += `
      <button onclick="changeCarouselImage('${spotId}', '${url}')">
        ${index + 1}
      </button>
    `;
  });

  popup += `</div>`;
}
  popup += `</div>`;
}

          if (data["動画"]) {
            popup += `<br><a href="${data["動画"]}" target="_blank">動画を見る</a>`;
          }

         const marker = L.marker([lat, lng], { icon: markerIcon })
  .bindPopup(popup);

          allSpots.push({
  title: data["タイトル"] || data["名前"],
  marker: marker
});

marker.category = category;

marker.addTo(map);

markers.push(marker);
          
        });
      });

    const legend = L.control({ position: 'topleft' });

    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `

<div class="legend-title">🧭 宝物カテゴリ</div>

<label><input type="checkbox" checked value="温泉"> ♨️ 温泉</label><br>
<label><input type="checkbox" checked value="絶景"> 🏔️ 絶景</label><br>
<label><input type="checkbox" checked value="風景"> 🏞️ 風景</label><br>
<label><input type="checkbox" checked value="グルメ"> 😋 グルメ</label><br>
<label><input type="checkbox" checked value="レジャー"> 🏕️ レジャー</label><br>
<label><input type="checkbox" checked value="自然農"> 🌱 自然農</label><br>
<label><input type="checkbox" checked value="神社・伝統"> ⛩️ 神社・伝統</label><br>
<label><input type="checkbox" checked value="動物"> 🐾 動物</label><br>
<label><input type="checkbox" checked value="イベント"> 🎆 イベント</label><br>
<label><input type="checkbox" checked value="幸せシェア"> 🌈 幸せシェア</label>
`;
      setTimeout(() => {

  document.querySelectorAll('.legend input').forEach(cb => {

    cb.addEventListener('change', () => {

      const category = cb.value;

      if (cb.checked) {
        activeCategories.add(category);
      } else {
        activeCategories.delete(category);
      }

      markers.forEach(marker => {

        if (activeCategories.has(marker.category)) {

          if (!map.hasLayer(marker)) {
            marker.addTo(map);
          }

        } else {

          if (map.hasLayer(marker)) {
            map.removeLayer(marker);
          }

        }

      });

    });

  });

}, 500); 
      return div;
    };

    legend.addTo(map);

    setTimeout(updatePrefectureList, 1000);
    
    function openImageModal(src) {
  document.getElementById('modalImage').src = src;
  document.getElementById('imageModal').style.display = 'flex';
}

function closeImageModal() {
  document.getElementById('imageModal').style.display = 'none';
}

function sendThanks(button, spotId) {
  const key = "thanks_" + spotId;
  const message = button.nextElementSibling;

  if (localStorage.getItem(key)) {
    button.style.display = "none";
    message.style.display = "inline-block";
    message.textContent = makeThanksMessage();
    return;
  }

  fetch("https://script.google.com/macros/s/AKfycbyx8GxcU-C-Wz_vF1Y0JY8Hv_b4AUccKDnIuHjtW9B_DGzTOR_Q97vO6aTHvchFpx3RjA/exec?action=add", {
    method: "GET",
    mode: "no-cors"
  });

  localStorage.setItem(key, "done");

  button.style.display = "none";
  message.style.display = "inline-block";
  message.textContent = makeThanksMessage();
}

function makeThanksMessage() {
  const flowers = ["🌸", "🌼", "🌷", "🌻", "🌺", "🪻"];
  const flower = flowers[Math.floor(Math.random() * flowers.length)];

  return "ありがとうを届けました" + flower;
}
    
map.on("popupopen", function(e) {

  const button =
    e.popup.getElement().querySelector(".thanks-btn");

  if (!button) return;

  const spotId = button.dataset.spotId;
  const key = "thanks_" + spotId;
  const message = button.nextElementSibling;

  if (localStorage.getItem(key)) {

    button.style.display = "none";

    message.style.display = "inline-block";

    message.textContent = makeThanksMessage();
  }

});

    function changeCarouselImage(spotId, imageUrl) {
  const img = document.getElementById(`carousel-${spotId}`);

  if (img) {
    img.src = imageUrl;
  }
}
    
function updatePrefectureList() {

  const legend = document.querySelector('.legend');

  if (!legend) return;

}

  function showMapA() {
  document.getElementById("map").style.display = "block";
  document.getElementById("growthMap").style.display = "none";
}

function showMapB() {
  document.getElementById("map").style.display = "none";
  document.getElementById("growthMap").style.display = "block";

  setTimeout(function() {
    loadJapanGrowthMap();
  }, 100);
}

function loadThanksTotal() {
  fetch("https://script.google.com/macros/s/AKfycbyx8GxcU-C-Wz_vF1Y0JY8Hv_b4AUccKDnIuHjtW9B_DGzTOR_Q97vO6aTHvchFpx3RjA/exec")
    .then(response => response.json())
    .then(data => {
      document.getElementById("thanksTotal").textContent = data.total || 0;
    })
    .catch(error => {
      document.getElementById("thanksTotal").textContent = "0";
    });
}

loadThanksTotal();

 function loadAchievement() {
  const total = 47;
  const achieved = Object.keys(prefectureCounts).length;

  document.getElementById("achievementCount").textContent =
    achieved + " / " + total + "県";

  document.getElementById("achievementPercent").textContent =
    ((achieved / total) * 100).toFixed(1) + "%";
}

setTimeout(loadAchievement, 1200);

function loadMissingPrefectures() {
  const allPrefectures = [
    "北海道","青森","岩手","宮城","秋田","山形","福島",
    "茨城","栃木","群馬","埼玉","千葉","東京","神奈川",
    "新潟","富山","石川","福井","山梨","長野","岐阜",
    "静岡","愛知","三重","滋賀","京都","大阪","兵庫",
    "奈良","和歌山","鳥取","島根","岡山","広島","山口",
    "徳島","香川","愛媛","高知","福岡","佐賀","長崎",
    "熊本","大分","宮崎","鹿児島","沖縄"
  ];

  const found = Object.keys(prefectureCounts);

  const missing = allPrefectures.filter(p => !found.includes(p));

  document.getElementById("missingPrefectures").innerHTML =
   missing
  .map(p => `<div>${p}</div>`)
  .join("");
}

    function loadJapanGrowthMap() {
  const found = Object.keys(prefectureCounts);

  const growthMap = L.map("japanGrowthMap", {
    zoomControl: false,
    attributionControl: false
  }).setView([37.8, 138.5], 5);

  fetch("japan.geojson")
    .then(response => response.json())
    .then(geojson => {
      L.geoJSON(geojson, {
        style: function(feature) {
         const pref = feature.properties.nam_ja;
          const discovered = found.includes(
  pref
    .replace("都","")
    .replace("府","")
    .replace("県","")
);

          return {
            color: "#ffffff",
            weight: 1,
            fillColor: discovered ? "#7fd18b" : "#dddddd",
            fillOpacity: 0.9
          };
        }
      }).addTo(growthMap);
    });
}
    
function searchPlace() {
  
  const keyword = document
    .getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  const found = allSpots.find(spot =>
    spot.title &&
    spot.title.toLowerCase().includes(keyword)
  );

  if (found) {
    map.setView(found.marker.getLatLng(), 12);
    found.marker.openPopup();
  } else {
    alert("見つかりませんでした");
  }
}
    
  </script>
</body>
</html>
