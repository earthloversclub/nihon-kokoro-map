<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈日本の心の宝地図🌈</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
body { margin: 0; font-family: sans-serif; }
.image-modal {
display: none;
position: fixed;
z-index: 9999;
inset: 0;
background: rgba(0,0,0,0.85);
justify-content: center;
align-items: center;
}

.image-modal img {
max-width: 92%;
max-height: 90%;
border-radius: 10px;
}
.modal-video {
display: none;
width: 92%;
height: 70%;
border: none;
border-radius: 10px;
background: black;
}
#imageCounter {
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
color: white;
font-size: 18px;
font-weight: bold;
}

.image-modal-close {
position: fixed;
top: 15px;
right: 20px;
color: white;
font-size: 36px;
font-weight: bold;
cursor: pointer;
}
.image-modal button {
width: 48px;
height: 48px;
background: rgba(0,0,0,0.8);
color: white;
border: none;
border-radius: 50%;
font-size: 28px;
font-weight: bold;
cursor: pointer;
}
.image-modal button:hover {
background: rgba(0,0,0,1);
}
@media (max-width: 600px) {
.image-modal button {
display: none;
}
}
header {
padding: 8px;
text-align: center;
background: #e9f8ef;
color: #256b3b;
font-weight: bold;
font-size: 20px;
}
header span {
display: inline;
}

@media (max-width: 600px) {
header span {
display: block;
}
}
#map {
height: calc(100vh - 52px);
width: 100%;
}

.legend {
background: white;
padding: 8px 10px;
border-radius: 10px;
box-shadow: 0 2px 8px rgba(0,0,0,0.25);
font-size: 14px;
line-height: 1.5;
z-index: 1 !important;
}
/* ここから下はあなたの元の全スタイルをそのまま残しています */
.leaflet-popup-content-wrapper {
border: 3px solid #ffb6d9 !important;
box-shadow: 0 0 15px rgba(255,182,217,0.7) !important;
}
/* （他の.growth-* や #thanksFlowerBox などの全スタイルもそのままです） */
</style>

<meta name="robots" content="noindex, nofollow">
</head>

<body>

<div id="passwordGate">
<div id="passwordBox">
<h2>🌎 地球大好きっ子クラブ 🌎</h2>
<p>合言葉を入力してください</p>
<input id="passwordInput" type="password" placeholder="合言葉">
<button onclick="checkPassword()">入る</button>
<div id="passwordError"></div>
</div>
</div>

<div id="titleSplash">
<div class="splashLight"></div>
<div class="splashText">
<div class="splashMain">🌎地球大好きっ子クラブ🌎</div>
<div class="splashSub">🌈日本の心の宝地図🌈</div>
<div class="splashMessage">見つけよう 🌱 伝えよう 💗 育てよう 🌈</div>
<div class="splashCredit">🌱 制作・運営　green orbit 🌱</div>
</div>
</div>

<header>
<span>🌎地球大好きっ子クラブ🌎</span>
<span>🌈日本の心の宝地図🌈</span>
</header>

<div id="mapSwitchBox">
<button id="mapSwitchButton" onclick="showMapB()">🌷成長地図▶</button>
</div>

<div id="rainbowBox">
<button onclick="location.href='heart.html'">🌈<br>虹の彼方へ</button>
</div>

<div id="searchBox">
<input type="text" id="searchInput" placeholder="地名やタイトルを検索">
<button onclick="searchPlace()">検索</button>
</div>

<div id="map"></div>
<div id="growthMap" style="display:none;"> ... </div> <!-- 成長地図部分はそのまま -->

<div id="imageModal" class="image-modal">
<span class="image-modal-close" onclick="closeImageModal()">×</span>
<button onclick="showModalImage(-1)">◀</button>
<img id="modalImage" src="">
<iframe id="modalVideo" class="modal-video" src="" allow="autoplay" allowfullscreen></iframe>
<div id="imageCounter">1 / 1</div>
<button onclick="showModalImage(1)">▶</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const SITE_PASSWORD = "seiseisui";
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwDoo6zqlwZ-1nkPt9pD3emE0ivjlIUPG8HnLFxTKLvc2GYmAqDJfDY68ykjOPCjmcoaw/exec";

// パスワード関連（そのまま）
function openTreasureMap() {
 localStorage.setItem("treasureMapAccess", "ok");
 document.getElementById("passwordGate").style.display = "none";
 setTimeout(() => { map.invalidateSize(); }, 800);
}
document.addEventListener("DOMContentLoaded", () => {
 if (localStorage.getItem("treasureMapAccess") === "ok") openTreasureMap();
});
function checkPassword() {
 const input = document.getElementById("passwordInput").value.trim();
 if (input === SITE_PASSWORD) openTreasureMap();
 else document.getElementById("passwordError").textContent = "合言葉が違います";
}

// Leaflet地図
const map = L.map('map', { zoomControl: false }).setView([37.8, 138.5], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
 attribution: '&copy; OpenStreetMap'
}).addTo(map);

// あなたのアイコン設定（そのまま）
function icon(color) { /* あなたの元のicon関数 */ }
const icons = { /* あなたの元のiconsオブジェクト全部 */ };

const markers = [];
const allSpots = [];

// === 新しい読み込み（Cloudinary + X風グリッド）===
async function loadPosts() {
 try {
 const res = await fetch(WEBAPP_URL);
 const posts = await res.json();

 posts.forEach(post => {
 if (!post.lat || !post.lng) return;

 const lat = parseFloat(post.lat);
 const lng = parseFloat(post.lng);

 // X風バランスグリッド
 let mediaHTML = '';
 if (post.mediaList && post.mediaList.length > 0) {
 mediaHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:8px 0;">`;
 post.mediaList.forEach(media => {
 if (media.type === 'video') {
 mediaHTML += `<video src="${media.url}" controls style="width:100%;height:158px;object-fit:cover;border-radius:8px;"></video>`;
 } else {
 mediaHTML += `<img src="${media.url}" style="width:100%;height:158px;object-fit:cover;border-radius:8px;cursor:pointer;" onclick="openMediaModal([{type:'image',url :'${media.url}'}],0)">`;
 }
 });
 mediaHTML += `</div>`;
 }

 const popup = `
 <strong>${post.title || '無題'}</strong><br>
 ${post.message ? post.message + '<br><br>' : ''}
 ${mediaHTML}
 <small>${post.prefecture || ''}　${post.poster || '匿名'}</small><br>
 <button class="thanks-btn" data-spot-id="${post.id}" onclick="sendThanks(this, '${post.id}')">ありがとうを届ける🌸</button>
 <div class="thanks-message"></div>
 `;

 const marker = L.marker([lat, lng], { icon: icons[post.category] || icon("blue") })
 .bindPopup(popup, { minWidth: 220, maxWidth: 360 });

 marker.addTo(map);
 markers.push(marker);
 allSpots.push({ title: post.title, marker: marker });
 });
 } catch (e) {
 console.error(e);
 }
}

// ページ読み込み
document.addEventListener("DOMContentLoaded", () => {
 loadPosts();
 // あなたの元のloadAchievement()、loadRanking()などもここに残す
});

// あなたの元の全関数（openMediaModal, sendThanks, showModalImage, loadJapanGrowthMap など）はここに全部残してください
</script>
</body>
</html>
