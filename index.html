// ==================== 修正版 loadPosts ====================
async function loadPosts() {
  try {
    console.log("🌍 データ取得開始...");

    // パラメータを正しく付ける
    const url = WEBAPP_URL + (WEBAPP_URL.includes("?") ? "&" : "?") + "action=getPosts";
    console.log("リクエストURL:", url);

    const response = await fetch(url);
    console.log("レスポンスステータス:", response.status);

    const text = await response.text();
    console.log("受信データ:", text);

    let posts;
    try {
      posts = JSON.parse(text);
    } catch (e) {
      console.error("JSONパース失敗");
      posts = [];
    }

    console.log("投稿件数:", Array.isArray(posts) ? posts.length : "配列じゃない");

    // マーカークリア
    markers.forEach(m => map.removeLayer(m));
    markers.length = 0;

    if (!Array.isArray(posts)) {
      console.error("postsが配列じゃない:", posts);
      return;
    }

    posts.forEach(post => {
      if (!post.lat || !post.lng) return;

      const lat = parseFloat(post.lat);
      const lng = parseFloat(post.lng);

      let mediaHTML = '';
      if (post.mediaList && post.mediaList.length > 0) {
        mediaHTML = `<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:6px; margin:8px 0;">`;
        post.mediaList.forEach(media => {
          if (media.type === 'video') {
            mediaHTML += `<video src="${media.url}" controls style="width:100%; height:158px; object-fit:cover; border-radius:8px;"></video>`;
          } else {
            mediaHTML += `<img src="${media.url}" style="width:100%; height:158px; object-fit:cover; border-radius:8px; cursor:pointer;" onclick="openMediaModal([{type:'image',url:'${media.url}'}], 0)">`;
          }
        });
        mediaHTML += `</div>`;
      }

      const popup = `
<strong>${post.title || '無題'}</strong><br>
${post.message ? post.message + "<br><br>" : ""}
${mediaHTML}
<small>${post.prefecture || ''}　${post.poster || '匿名'}</small><br>
<button class="thanks-btn" data-spot-id="${post.id}" onclick="sendThanks(this, '${post.id}')">
ありがとうを届ける🌸
</button>
<div class="thanks-message"></div>
`;

      const marker = L.marker([lat, lng], { icon: icons[post.category] || icon("blue") })
        .bindPopup(popup, { minWidth: 220, maxWidth: 360 });

      marker.addTo(map);
      markers.push(marker);
    });

    console.log("🎉 マーカー追加完了！ 合計:", markers.length, "件");

  } catch (e) {
    console.error("💥 loadPostsエラー:", e);
  }
}

document.addEventListener("DOMContentLoaded", () => {
  loadPosts();
});

</script>
