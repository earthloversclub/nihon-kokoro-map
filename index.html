  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v40CNsKzTus67itmVJ4NY45nYz_QLW400WRXj9XjDkM/pub?output=csv";

    const map = L.map('map', { zoomControl: false }).setView([37.8, 138.5], 5);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    function icon(color) {
      return new L.Icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
      });
    }
const markers = [];
    const prefectureCounts = {};
    const prefectureThanks = {};
    const allSpots = [];
    let japanGrowthMapInstance = null;
const activeCategories = new Set([
  "温泉",
  "絶景",
  "風景",
  "グルメ",
  "レジャー",
  "自然農",
  "神社・伝統",
  "動物",
  "イベント",
  "幸せシェア"
]);
    
    const icons = {
      "温泉": icon("red"),
      "絶景": icon("blue"),
      "風景": icon("green"),
      "グルメ": icon("orange"),
      "レジャー": icon("violet"),
      "自然農": icon("yellow"),
      "神社・伝統": icon("gold"),
      "動物": icon("grey"),
      "イベント": icon("black"),
"幸せシェア": new L.Icon({
  iconUrl: "https://drive.google.com/thumbnail?id=1-LOYbEjRCdi3b-0nN0aoXoTLRE9bPCXI&sz=w1000",

  iconSize: [55, 55],
  iconAnchor: [27, 55],
  popupAnchor: [0, -35]
})
    };

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = '', quote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quote && next === '"') {
          cell += '"';
          i++;
        } else if (c === '"') {
          quote = !quote;
        } else if (c === ',' && !quote) {
          row.push(cell);
          cell = '';
        } else if ((c === '\n' || c === '\r') && !quote) {
          if (cell || row.length) {
            row.push(cell);
            rows.push(row);
            row = [];
            cell = '';
          }
          if (c === '\r' && next === '\n') i++;
        } else {
          cell += c;
        }
      }

      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
      }

      return rows;
    }

    fetch(sheetUrl)
      .then(response => response.text())
      .then(csv => {
        const rows = parseCSV(csv);
        const headers = rows[0];

        rows.slice(1).forEach(row => {
          const data = {};
          headers.forEach((h, i) => data[h] = row[i]);

          if (!data["緯度"] || !data["経度"]) return;

          const lat = Number(data["緯度"]);
          const lng = Number(data["経度"]);
          const category = data["カテゴリ"];
          const prefecture = data["都道府県"];

if (prefecture) {
  prefectureCounts[prefecture] =
    (prefectureCounts[prefecture] || 0) + 1;

  prefectureThanks[prefecture] =
    (prefectureThanks[prefecture] || 0) + (Number(data["ありがとう数"]) || 0);
}
          const markerIcon = icons[category] || icon("blue");

          let popup = `
  <strong>${data["タイトル"] || data["名前"]}</strong><br>
  ${category ? "カテゴリ：" + category + "<br>" : ""}
  ${data["説明"] ? data["説明"] + "<br>" : ""}
  ${data["投稿者"] ? "投稿者：" + data["投稿者"] + "<br>" : ""}
  ${data["投稿日"] ? "投稿日：" + data["投稿日"] + "<br>" : ""}

<button class="thanks-btn" data-spot-id="${data["ID"]}" onclick="sendThanks(this, '${data["ID"]}')">
  ありがとうを届ける🌸
</button>
<div class="thanks-message"></div>
`;

          function convertDriveImageUrl(url) {
  if (!url) return "";

  const match = url.match(/\/d\/([^/]+)/);

  if (match && match[1]) {
    return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
  }

  return url;
}

const imageUrls = [];

if (data["画像"] && data["画像"] !== data["動画"]) {
  imageUrls.push(convertDriveImageUrl(data["画像"]));
}

if (data["画像2"] && data["画像2"] !== data["動画"]) {
  imageUrls.push(convertDriveImageUrl(data["画像2"]));
}

if (data["画像3"] && data["画像3"] !== data["動画"]) {
  imageUrls.push(convertDriveImageUrl(data["画像3"]));
}

if (data["画像4"] && data["画像4"] !== data["動画"]) {
  imageUrls.push(convertDriveImageUrl(data["画像4"]));
}

if (imageUrls.length > 0 || data["動画"]) {
  if (imageUrls.length === 1 && !data["動画"]) {
  popup += `<div class="image-carousel">`;
} else {
  popup += `<div class="image-carousel multi-images">`;
}

  imageUrls.forEach((url, index) => {
    popup += `
      <img
        class="popup-img"
        src="${url}"
        onclick='openImageModal(${JSON.stringify(imageUrls)}, ${index})'
      >
    `;
  });

if (data["動画"]) {
  const videoMatch = data["動画"].match(/\/d\/([^/]+)/);
  const videoUrl = videoMatch
    ? "https://drive.google.com/file/d/" + videoMatch[1] + "/preview"
    : data["動画"];

  popup += `
    <div class="video-thumb"
         onclick="window.open('${data["動画"]}', '_blank')">

      <iframe
        src="${videoUrl}"
        class="popup-video"
        allow="autoplay"
        allowfullscreen>
      </iframe>

      <div class="video-play-mark">▶</div>

    </div>
  `;
}

  popup += `</div>`;
}
         const marker = L.marker([lat, lng], { icon: markerIcon })
.bindPopup(popup, {
  minWidth: 190,
  maxWidth: 240
});

          allSpots.push({
  title: data["タイトル"] || data["名前"],
  marker: marker
});

marker.category = category;

marker.addTo(map);

markers.push(marker);
  document.getElementById("totalPostsCount").textContent =
  markers.length + "件";        
        });
      });

    const legend = L.control({ position: 'topleft' });

    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `

<div class="category-title">🧭 宝物カテゴリ</div>

<label><input type="checkbox" checked value="温泉"> ♨️ 温泉</label><br>
<label><input type="checkbox" checked value="絶景"> 🏔️ 絶景</label><br>
<label><input type="checkbox" checked value="風景"> 🏞️ 風景</label><br>
<label><input type="checkbox" checked value="グルメ"> 😋 グルメ</label><br>
<label><input type="checkbox" checked value="レジャー"> 🏕️ レジャー</label><br>
<label><input type="checkbox" checked value="自然農"> 🌱 自然農</label><br>
<label><input type="checkbox" checked value="神社・伝統"> ⛩️ 神社・伝統</label><br>
<label><input type="checkbox" checked value="動物"> 🐾 動物</label><br>
<label><input type="checkbox" checked value="イベント"> 🎆 イベント</label><br>
<label><input type="checkbox" checked value="幸せシェア"> 🌈 幸せシェア</label>
`;
      setTimeout(() => {

  document.querySelectorAll('.legend input').forEach(cb => {

    cb.addEventListener('change', () => {

      const category = cb.value;

      if (cb.checked) {
        activeCategories.add(category);
      } else {
        activeCategories.delete(category);
      }

      markers.forEach(marker => {

        if (activeCategories.has(marker.category)) {

          if (!map.hasLayer(marker)) {
            marker.addTo(map);
          }

        } else {

          if (map.hasLayer(marker)) {
            map.removeLayer(marker);
          }

        }

      });

    });

  });

}, 500); 
      return div;
    };

    legend.addTo(map);

const totalPostsBox = L.control({ position: 'topleft' });

totalPostsBox.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');

  div.innerHTML = `
  
    <div style="
text-align:center;
position:relative;
">

<div style="
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
font-size:14px;

color:#b8860b;">
N
</div>

<div style="
position:absolute;
right:-10px;
top:50%;
transform:translateY(-50%);

 let modalImages = [];
let modalIndex = 0;

function openImageModal(images, index) {
  modalImages = images;
  modalIndex = index;

  document.getElementById('modalImage').src = modalImages[modalIndex];
  document.getElementById('imageCounter').textContent =
  (modalIndex + 1) + " / " + modalImages.length;
  document.getElementById('imageModal').style.display = 'flex';
}

function showModalImage(direction) {
  if (modalImages.length === 0) return;

  modalIndex += direction;

  if (modalIndex < 0) {
    modalIndex = modalImages.length - 1;
  }

  if (modalIndex >= modalImages.length) {
    modalIndex = 0;
  }

  document.getElementById('modalImage').src = modalImages[modalIndex];
  document.getElementById('imageCounter').textContent =
  (modalIndex + 1) + " / " + modalImages.length;
}

function closeImageModal() {
  document.getElementById('imageModal').style.display = 'none';
}

    let touchStartX = 0;

document.getElementById('imageModal').addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
});

document.getElementById('imageModal').addEventListener('touchend', function(e) {
  let touchEndX = e.changedTouches[0].clientX;

  if (touchStartX - touchEndX > 50) {
    showModalImage(1);
  }

  if (touchEndX - touchStartX > 50) {
    showModalImage(-1);
  }
});

function sendThanks(button, spotId) {
  const key = "thanks_" + spotId;
  const message = button.nextElementSibling;

  if (localStorage.getItem(key)) {
    button.style.display = "none";
    message.style.display = "block";
    message.textContent = makeThanksMessage();
    return;
  }

  fetch("https://script.google.com/macros/s/AKfycbyx8GxcU-C-Wz_vF1Y0JY8Hv_b4AUccKDnIuHjtW9B_DGzTOR_Q97vO6aTHvchFpx3RjA/exec?action=add&spotId=" + encodeURIComponent(spotId), {
    method: "GET",
    mode: "no-cors"
  });

  localStorage.setItem(key, "done");

  button.style.display = "none";
message.style.display = "block";
message.textContent = makeThanksMessage();
showSparkles();
}

function getThanksColor(count) {
  if (count === 0) return "#dddddd";
  if (count <= 100) return "#ffffff";
  if (count <= 200) return "#aeefff";
  if (count <= 300) return "#4da3ff";
  if (count <= 400) return "#66cc66";
  if (count <= 500) return "#fff176";
  if (count <= 600) return "#ff9800";
  if (count <= 700) return "#ff8acb";

}

function showFlowerConfetti(level) {
  const flowers = ["🌸", "🌼", "🌷", "🌺", "🪻", "🌻"];
  const count = level === "max" ? 80 : 35;
  const size = level === "max" ? 34 : 26;
  const duration = level === "max" ? 2500 : 1600;

  for (let i = 0; i < count; i++) {
    const flower = document.createElement("div");
    flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];

    flower.style.position = "fixed";
    flower.style.left = Math.random() * window.innerWidth + "px";
    flower.style.top = "-40px";
    flower.style.fontSize = size + "px";
    flower.style.pointerEvents = "none";
    flower.style.zIndex = "9999";

    document.body.appendChild(flower);

    flower.animate(
      [
        { transform: "translateY(0px) rotate(0deg)", opacity: 1 },
        { transform: "translateY(" + (window.innerHeight + 100) + "px) rotate(720deg)", opacity: 0 }
      ],
      {
        duration: duration + Math.random() * 800,
        easing: "ease-in"
      }
    );

    setTimeout(() => flower.remove(), duration + 1000);
  }
}

function searchPlace() {
  
  const keyword = document
    .getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  const found = allSpots.find(spot =>
    spot.title &&
    spot.title.toLowerCase().includes(keyword)
  );

  if (found) {
    map.setView(found.marker.getLatLng(), 12);
    found.marker.openPopup();
  } else {
    alert("見つかりませんでした");
  }
}
