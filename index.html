.splashMain {

.splashLight {
position: absolute;
width: 160%;
height: 120px;
background: linear-gradient(
90deg,
transparent,
rgba(255, 120, 180, 0.35),
rgba(255, 240, 120, 0.45),
rgba(120, 220, 255, 0.45),
transparent
);
transform: rotate(-18deg) translateX(-120%);
animation: rainbowSweep 2.2s ease forwards;
}

@keyframes titlePop {
from {
opacity: 0;
transform: scale(0.9) translateY(20px);
}
to {
opacity: 1;
transform: scale(1) translateY(0);
}
}

@keyframes rainbowSweep {
to {
transform: rotate(-18deg) translateX(120%);
}
}

@keyframes splashOut {
0%, 75% {
opacity: 1;
}
100% {
opacity: 0;
visibility: hidden;
pointer-events: none;
}
}

.rainbow-glow {
animation: none;
}

@keyframes rainbowGlow {

0% {
filter: drop-shadow(0 0 0px rgba(255,255,255,0));
}

50% {
filter:
drop-shadow(0 0 10px #ffffff)
drop-shadow(0 0 20px #ffffff)
drop-shadow(0 0 35px #ffffff)
drop-shadow(0 0 60px rgba(255,255,255,1))
drop-shadow(0 0 90px rgba(255,255,255,0.9))
drop-shadow(0 0 120px rgba(255,255,255,0.7));
}
100% {
filter: drop-shadow(0 0 0px rgba(255,255,255,0));
}

}

const markers = [];

iconSize: [58, 58],

})
};

function parseCSV(text) {
const rows = [];
let row = [], cell = '', quote = false;

for (let i = 0; i < text.length; i++) {
const c = text[i];
const next = text[i + 1];

if (c === '"' && quote && next === '"') {
cell += '"';
i++;
} else if (c === '"') {
quote = !quote;
} else if (c === ',' && !quote) {
row.push(cell);
cell = '';
} else if ((c === '\n' || c === '\r') && !quote) {
if (cell || row.length) {
row.push(cell);
rows.push(row);
row = [];
cell = '';
}
if (c === '\r' && next === '\n') i++;
} else {
cell += c;
}
}

if (cell || row.length) {
row.push(cell);
rows.push(row);
}

return rows;
}

fetch(sheetUrl + "&t=" + Date.now())
.then(response => response.text())
.then(csv => {
const rows = parseCSV(csv);
const headers = rows[0];

rows.slice(1).forEach(row => {
const data = {};
headers.forEach((h, i) => data[h] = row[i]);

if (!data["緯度"] || !data["経度"]) return;

const lat = Number(data["緯度"]);
const lng = Number(data["経度"]);

if (prefecture) {

(prefectureCounts[prefecture] || 0) + 1;

prefectureThanks[prefecture] =
(prefectureThanks[prefecture] || 0) + (Number(data["ありがとう数"]) || 0);
}
const markerIcon = icons[category] || icon("blue");

let popup = `
<div style="font-size:17px; line-height:1.45;">

</div>

<button class="thanks-btn" data-spot-id="${data["ID"]}" onclick="sendThanks(this, '${data["ID"]}')">
ありがとうを届ける🌸
</button>
<div class="thanks-message"></div>
`;

function convertDriveImageUrl(url) {
if (!url) return "";

const match = url.match(/\/d\/([^/]+)/);

if (match && match[1]) {
return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
}

return url;
}

const imageUrls = [];

if (data["画像"] && data["画像"] !== data["動画"]) {
imageUrls.push(convertDriveImageUrl(data["画像"]));
}

if (data["画像2"] && data["画像2"] !== data["動画"]) {
imageUrls.push(convertDriveImageUrl(data["画像2"]));
}

if (data["画像3"] && data["画像3"] !== data["動画"]) {
imageUrls.push(convertDriveImageUrl(data["画像3"]));
}

if (data["画像4"] && data["画像4"] !== data["動画"]) {
imageUrls.push(convertDriveImageUrl(data["画像4"]));
}

if (imageUrls.length > 0 || data["動画"]) {
const mediaCount = imageUrls.length + (data["動画"] ? 1 : 0);

popup += mediaCount === 1
? `<div class="image-carousel media-count-1">`
: `<div class="image-carousel multi-images media-count-${mediaCount}">`;

const mediaItems = imageUrls.map(url => ({
type: "image",
url: url
}));

if (data["動画"]) {
mediaItems.push({
type: "video",
url: data["動画"]
});
}

const safeMediaItems = JSON.stringify(mediaItems).replace(/'/g, "&apos;");

imageUrls.forEach((url, index) => {
popup += `
<img
class="popup-img"
src="${url}"
onclick='openMediaModal(${safeMediaItems}, ${index})'
>
`;
});

if (data["動画"]) {
const videoThumbnail = data["動画"]
.replace("/video/upload/", "/video/upload/so_5/")
.replace(".mp4", ".jpg");

console.log("動画サムネURL:", videoThumbnail);

popup += `
<div class="popup-img video-thumb" onclick='openMediaModal(${safeMediaItems}, ${mediaItems.length - 1})'>
  <img class="video-thumb-img" src="${videoThumbnail}">
  <div class="video-play-mark">▶</div>
</div>
`;
}

popup += `</div>`;
}

function isWithin10Minutes(timeText) {
if (!timeText) return false;

const eventTime = new Date(timeText.replace(/\//g, "-")).getTime();
const nowTime = Date.now();

return nowTime - eventTime <= 30 * 60 * 1000;
}

let angelEmoji = "";

if (category === "人・活動・想い") {
if (isWithin10Minutes(data["神降臨時刻"])) {
angelEmoji = "🌈👑 神降臨 👑🌈<br><span style='font-size:10px;'>✨ THANK YOU 3000 ✨</span>";
} else if (isWithin10Minutes(data["大天使降臨時刻"])) {
angelEmoji = "🪽👼大天使降臨👼🪽";
} else if (isWithin10Minutes(data["天使降臨時刻"])) {
angelEmoji = "👼天使降臨";
}
}

const popupClassMap = {
  "温泉・宿泊": "popup-onsen",
  "自然・絶景": "popup-nature",
  "グルメ・特産品": "popup-gourmet",
  "神社仏閣・歴史": "popup-shrine",
  "自然農": "popup-farm",
  "イベント・体験": "popup-event",
  "人・活動・想い": "popup-rainbow"
};

const popupClass = popupClassMap[category] || "popup-default";
  
let marker;

if (angelEmoji) {
const specialIcon = L.divIcon({
html: `
<div class="special-pin-wrap">
<div class="angel-effect">${angelEmoji}</div>
<img src="${markerIcon.options.iconUrl}" style="width:${markerIcon.options.iconSize[0]}px; height:${markerIcon.options.iconSize[1]}px;">
</div>
`,
className: "",
iconSize: [90, 80],
iconAnchor: [45, 75],
popupAnchor: [0, -75]
});

marker = L.marker([lat, lng], { icon: specialIcon })
.bindPopup(popup, {
  minWidth: 230,
  maxWidth: 280,
  className: popupClass
});

} else {
marker = L.marker([lat, lng], { icon: markerIcon })
.bindPopup(popup, {
  minWidth: 230,
  maxWidth: 280,
  className: popupClass
});
}

allSpots.push({
title: data["タイトル"] || data["名前"],
marker: marker
});

marker.category = category;

marker.addTo(map);
marker.on("popupopen", function(){
  document.getElementById("mapSwitchBox").style.display = "none";
});

marker.on("popupclose", function(){
  document.getElementById("mapSwitchBox").style.display = "flex";
});
  
markers.push(marker);

const totalPostsCountEl =
document.getElementById("totalPostsCount");

if (totalPostsCountEl) {
totalPostsCountEl.textContent =
markers.length + "件";
}

});

loadAchievement();
loadRanking();

});

const totalPostsBox = L.control({ position: 'bottomright' });

totalPostsBox.onAdd = function () {

const isPC = window.innerWidth >= 768;  
const div = L.DomUtil.create('div', 'legend');

div.style.width = isPC ? "420px" : "330px";
div.style.height = isPC ? "270px" : "210px";

div.innerHTML = `

0件

const legend = L.control({ position: 'topleft' });

legend.onAdd = function () {

const isPC = window.innerWidth >= 768;  

div.style.marginTop = isPC ? "-10px" : "-18px";
div.style.marginLeft = "-9px";

div.innerHTML = `
<label><input type="checkbox" checked value="温泉・宿泊"> <b>♨️ 温泉・宿泊</b></label><br>

<label><input type="checkbox" checked value="イベント・体験"> <b>🎪 イベント・体験</b></label><br>
<label><input type="checkbox" checked value="人・活動・想い"> <b>💗 人・活動・想い</b></label>

setTimeout(() => {
document.querySelectorAll('.legend input').forEach(cb => {

activeCategories.add(category);

activeCategories.delete(category);
}

markers.forEach(marker => {

}
});

});
}, 500);

return div;
};
legend.addTo(map);
setTimeout(updatePrefectureList, 1000);
let modalItems = [];
let modalIndex = 0;

function openMediaModal(items, index) {
modalItems = items;
modalIndex = index;

renderModalItem();

document.getElementById('imageModal').style.display = 'flex';
}

function renderModalItem() {
const item = modalItems[modalIndex];

const img = document.getElementById('modalImage');
const video = document.getElementById('modalVideo');

if (item.type === "image") {
video.style.display = "none";
video.src = "";

img.style.display = "block";
img.style.opacity = "0";
img.style.transform = "translateX(25px)";

setTimeout(() => {
  img.src = item.url;

  setTimeout(() => {
    img.style.opacity = "1";
    img.style.transform = "translateX(0)";
  }, 30);
}, 80);
}

if (item.type === "video") {
img.style.display = "none";
img.src = "";

video.style.display = "block";
video.src = item.url;
}

document.getElementById('imageCounter').textContent =
(modalIndex + 1) + " / " + modalItems.length;
}

function showModalImage(direction) {
if (modalItems.length === 0) return;

modalIndex += direction;

if (modalIndex < 0) {
modalIndex = modalItems.length - 1;
}

if (modalIndex >= modalItems.length) {
modalIndex = 0;
}

renderModalItem();
}

function closeImageModal() {
document.getElementById('imageModal').style.display = 'none';
document.getElementById('modalVideo').src = "";
}
let touchStartX = 0;

document.getElementById('imageModal').addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

document.getElementById('imageModal').addEventListener('touchend', function(e) {
  const touchEndX = e.changedTouches[0].clientX;
  const diffX = touchEndX - touchStartX;

  if (Math.abs(diffX) < 50) return;

  if (diffX > 0) {
    showModalImage(-1);
  } else {
    showModalImage(1);
  }
}, { passive: true });

function sendThanks(button, spotId) {
const key = "thanks_" + spotId;
const message = button.nextElementSibling;

if (localStorage.getItem(key)) {
button.style.display = "none";
message.style.display = "block";
message.textContent = makeThanksMessage();
return;
}

fetch("https://script.google.com/macros/s/AKfycbybLspt-tzGEuWKZuEi4dukk4chmcU03jwS0_F9vuhbkW2RkpfXK8KOpSot8Za8BE6r/exec?action=add&spotId=" + encodeURIComponent(spotId), {
  method: "GET",
  mode: "no-cors"
});
  
localStorage.setItem(key, "done");

button.style.display = "none";
message.style.display = "block";
message.textContent = makeThanksMessage();
showSparkles();
}

function showSparkles() {
for (let i = 0; i < 20; i++) {
const sparkle = document.createElement("div");

sparkle.innerHTML = "✨";
sparkle.style.position = "fixed";
sparkle.style.left = Math.random() * window.innerWidth + "px";
sparkle.style.top = Math.random() * window.innerHeight + "px";
sparkle.style.fontSize = "24px";
sparkle.style.pointerEvents = "none";
sparkle.style.zIndex = "9999";

document.body.appendChild(sparkle);

sparkle.animate(
[
{ transform: "translateY(0px)", opacity: 1 },
{ transform: "translateY(-100px)", opacity: 0 }
],
{
duration: 1200,
easing: "ease-out"
}
);

setTimeout(() => sparkle.remove(), 1200);
}
}
function makeThanksMessage() {
const flowers = ["🌸", "🌼", "🌷", "🌻", "🌺", "🪻"];
const flower = flowers[Math.floor(Math.random() * flowers.length)];

return "ありがとうを届けました" + flower;
}

document.getElementById("searchBox").style.display = "none";
document.getElementById("rainbowBox").style.display = "none";

const key = "thanks_" + spotId;

if (localStorage.getItem(key)) {

button.style.display = "none";

showSparkles();

document.querySelectorAll(".legend").forEach(box => {

function getThanksColor(count) {
if (count === 0) return "#dddddd";
if (count <= 100) return "#ffffff";
if (count <= 200) return "#aeefff";
if (count <= 300) return "#4da3ff";
if (count <= 400) return "#66cc66";
if (count <= 500) return "#fff176";
if (count <= 600) return "#ff9800";
if (count <= 700) return "#ff8acb";
return "#ff3333";
}

function showFlowerConfetti(level) {
const flowers = ["🌸", "🌼", "🌷", "🌺", "🪻", "🌻"];
const count = level === "max" ? 80 : 35;
const size = level === "max" ? 34 : 26;
const duration = level === "max" ? 2500 : 1600;

for (let i = 0; i < count; i++) {
const flower = document.createElement("div");
flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];

flower.style.position = "fixed";
flower.style.left = Math.random() * window.innerWidth + "px";
flower.style.top = "-40px";
flower.style.fontSize = size + "px";
flower.style.pointerEvents = "none";
flower.style.zIndex = "9999";

document.body.appendChild(flower);

flower.animate(
[
{ transform: "translateY(0px) rotate(0deg)", opacity: 1 },
{ transform: "translateY(" + (window.innerHeight + 100) + "px) rotate(720deg)", opacity: 0 }
],
{
duration: duration + Math.random() * 800,
easing: "ease-in"
}
);

setTimeout(() => flower.remove(), duration + 1000);
}
}
function loadJapanGrowthMap() {
const found = Object.keys(prefectureCounts);

zoomControl: false,
attributionControl: false
}).setView([37.8, 138.5], 5);

.then(response => response.json())
.then(geojson => {
L.geoJSON(geojson, {
style: function(feature) {
const pref = feature.properties.nam_ja;
const discovered = found.includes(
pref
.replace("都","")
.replace("府","")
.replace("県","")
);

return {
color: "#ffffff",
weight: 1,
fillColor: getThanksColor(prefectureThanks[
pref.replace("都","").replace("府","").replace("県","")

function searchPlace() {
const keyword = document
.getElementById("searchInput")
.value
.trim()
.toLowerCase();

const found = allSpots.find(spot =>
spot.title &&
spot.title.toLowerCase().includes(keyword)
);

if (found) {
map.setView(found.marker.getLatLng(), 12);
found.marker.openPopup();
} else {
alert("見つかりませんでした");
}
