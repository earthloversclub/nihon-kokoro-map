<!DOCTYPE html>
<html lang="ja">

body { margin: 0; font-family: sans-serif; }
.image-modal {
display: none;
position: fixed;
z-index: 9999;
inset: 0;
background: rgba(0,0,0,0.85);
justify-content: center;
align-items: center;
}

.image-modal img {
max-width: 92%;
max-height: 90%;
border-radius: 10px;
}
.modal-video {
display: none;
width: 92%;
height: 70%;
border: none;
border-radius: 10px;
background: black;
}
#imageCounter {
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
color: white;
font-size: 18px;
font-weight: bold;
}

.image-modal-close {
position: fixed;
top: 15px;
right: 20px;
color: white;
font-size: 36px;
font-weight: bold;
cursor: pointer;
}
.image-modal button {
width: 48px;
height: 48px;

background: rgba(0,0,0,0.8);
color: white;

border: none;
border-radius: 50%;

font-size: 28px;
font-weight: bold;

cursor: pointer;
}
.image-modal button:hover {
background: rgba(0,0,0,1);
}
@media (max-width: 600px) {
.image-modal button {
display: none;
}
}
header {
padding: 8px;
text-align: center;
background: #e9f8ef;
color: #256b3b;
font-weight: bold;
font-size: 20px;
}
header span {
display: inline;
}

@media (max-width: 600px) {
header span {
display: block;
}
}
#map {
height: calc(100vh - 52px);
width: 100%;
}

.legend {
background: white;

border-radius: 10px;

font-size: 14px;
line-height: 1.5;
z-index: 1 !important;
}
.leaflet-popup-pane {
z-index: 700;

.leaflet-control-container {

.leaflet-popup {

.leaflet-control {

.leaflet-top,

}

.category-title {

    color: #2d6b2d;

}
    
.popup-img {

  border-radius: 8px;
  margin-top: 6px;
  cursor: pointer;
}

.image-carousel {
  margin-top: 8px;
  text-align: center;
}

.image-carousel.multi-images {
  width: 180px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px;
  margin-top: 8px;
  margin-left: auto;
margin-right: auto;
}
    
.media-count-1 {
  display: block;
}

.media-count-1 .popup-img {
  width: 180px;
  height: auto;
  object-fit: contain;
}
.media-count-3 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px;
}

.media-count-3 > :first-child {
  grid-row: 1 / span 2;
  height: 174px !important;
}
    
.image-carousel.multi-images .popup-img {
  width: 100%;
  height: 85px;
  object-fit: cover;
  margin-top: 0;
}

.popup-video {
  width: 100%;
  height: 85px;
  border: 0;
  border-radius: 8px;
}

.video-thumb {
  position: relative;
  width: 180px;
  height: 120px;
  margin: 8px auto 0;
  cursor: pointer;
}

.video-thumb-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 8px;
  display: block;
}
    
.video-play-mark {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 32px;
  font-weight: bold;
  pointer-events: none;
  text-shadow: 0 2px 6px rgba(0,0,0,0.8);
}
    
.carousel-buttons button {
  border: none;
  border-radius: 50%;
  background: #e8f5ee;
  color: #256b3b;
  margin: 0 3px;
  cursor: pointer;
}

  display: block;

  background: #ffe4b3;
  color: #b86a00;
  cursor: pointer;
  font-size: 14px;
}
