<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌈日本の心の宝地図🌈</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
  body { margin: 0; font-family: sans-serif; }
    
  .image-modal {
  display: none;
  position: fixed;
  z-index: 9999;
  inset: 0;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}

.image-modal img {
  max-width: 92%;
  max-height: 90%;
  border-radius: 10px;
}

.image-modal-close {
  position: fixed;
  top: 15px;
  right: 20px;
  color: white;
  font-size: 36px;
  font-weight: bold;
  cursor: pointer;
}

    header {
      padding: 12px;
      text-align: center;
      background: #e9f8ef;
      color: #256b3b;
      font-weight: bold;
      font-size: 20px;
    }

    #map {
      height: calc(100vh - 52px);
      width: 100%;
    }

    .legend {
      background: white;
      padding: 8px 10px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 12px;
      line-height: 1.5;
    }

    .legend-title {
      font-weight: bold;
      margin-bottom: 4px;
      color: #256b3b;
    }

    .popup-img {
      width: 180px;
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
      cursor: pointer;
    }

    .image-carousel {
  margin-top: 8px;
  text-align: center;
}

.carousel-buttons {
  margin-top: 5px;
}

.carousel-buttons button {
  border: none;
  border-radius: 50%;
  background: #e8f5ee;
  color: #256b3b;
  margin: 0 3px;
  cursor: pointer;
}
    
.thanks-btn {
  margin-top: 8px;
  padding: 6px 10px;
  border: none;
  border-radius: 20px;
  background: #ffe4b3;
  color: #b86a00;
  cursor: pointer;
  font-size: 14px;
}

.thanks-message {
  display: none;
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 20px;
  background: #ffd6ec;
  color: #b24a68;
  font-size: 14px;
}
#searchBox {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  background: white;
  padding: 8px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

#searchInput {
  width: 180px;
  padding: 5px;
}
    
  </style>
</head>

<body>
  <header>🌏地球大好きっ子クラブ🌎<br>🌈日本の心の宝地図🌈</header>
  
<div id="searchBox">
  <input type="text" id="searchInput" placeholder="地名やタイトルを検索">
  <button onclick="searchPlace()">検索</button>
</div>

  <div id="map"></div>
<div id="imageModal" class="image-modal">
  <span class="image-modal-close" onclick="closeImageModal()">×</span>
  <img id="modalImage" src="">
</div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v40CNsKzTus67itmVJ4NY45nYz_QLW400WRXj9XjDkM/pub?output=csv";

    const map = L.map('map', { zoomControl: false }).setView([37.8, 138.5], 5);

    L.control.zoom({ position: 'bottomleft' }).addTo(map);
    
setTimeout(() => {
  document.querySelector('.leaflet-control-zoom').style.marginBottom = '30px';
}, 500);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    function icon(color) {
      return new L.Icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
      });
    }
const markers = [];
    const prefectureCounts = {};
    const allSpots = [];
const activeCategories = new Set([
  "温泉",
  "絶景",
  "風景",
  "グルメ",
  "レジャー",
  "自然農",
  "神社・伝統",
  "動物",
  "イベント",
  "幸せシェア"
]);
    
    const icons = {
      "温泉": icon("red"),
      "絶景": icon("blue"),
      "風景": icon("green"),
      "グルメ": icon("orange"),
      "レジャー": icon("violet"),
      "自然農": icon("yellow"),
      "神社・伝統": icon("gold"),
      "動物": icon("grey"),
      "イベント": icon("black"),
"幸せシェア": new L.Icon({
  iconUrl: "https://drive.google.com/thumbnail?id=1-LOYbEjRCdi3b-0nN0aoXoTLRE9bPCXI&sz=w1000",

  iconSize: [55, 55],
  iconAnchor: [27, 55],
  popupAnchor: [0, -35]
})
    };

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = '', quote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quote && next === '"') {
          cell += '"';
          i++;
        } else if (c === '"') {
          quote = !quote;
        } else if (c === ',' && !quote) {
          row.push(cell);
          cell = '';
        } else if ((c === '\n' || c === '\r') && !quote) {
          if (cell || row.length) {
            row.push(cell);
            rows.push(row);
            row = [];
            cell = '';
          }
          if (c === '\r' && next === '\n') i++;
        } else {
          cell += c;
        }
      }

      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
      }

      return rows;
    }

    fetch(sheetUrl)
      .then(response => response.text())
      .then(csv => {
        const rows = parseCSV(csv);
        const headers = rows[0];

        rows.slice(1).forEach(row => {
          const data = {};
          headers.forEach((h, i) => data[h] = row[i]);

          if (!data["緯度"] || !data["経度"]) return;

          const lat = Number(data["緯度"]);
          const lng = Number(data["経度"]);
          const category = data["カテゴリ"];
          const prefecture = data["都道府県"];

if (prefecture) {
  prefectureCounts[prefecture] =
    (prefectureCounts[prefecture] || 0) + 1;
}
          const markerIcon = icons[category] || icon("blue");

          let popup = `
  <strong>${data["タイトル"] || data["名前"]}</strong><br>
  ${category ? "カテゴリ：" + category + "<br>" : ""}
  ${data["説明"] ? data["説明"] + "<br>" : ""}
  ${data["投稿者"] ? "投稿者：" + data["投稿者"] + "<br>" : ""}
  ${data["投稿日"] ? "投稿日：" + data["投稿日"] + "<br>" : ""}

  <button class="thanks-btn" onclick="sendThanks(this)">
  ありがとうを届ける🌸
</button>
<div class="thanks-message"></div>
`;

          function convertDriveImageUrl(url) {
  if (!url) return "";

  const match = url.match(/\/d\/([^/]+)/);

  if (match && match[1]) {
    return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
  }

  return url;
}

const imageUrls = [];

if (data["画像"]) {
  imageUrls.push(convertDriveImageUrl(data["画像"]));
}

if (data["画像2"]) {
  imageUrls.push(convertDriveImageUrl(data["画像2"]));
}

if (imageUrls.length > 0) {
  const spotId = data["ID"];

  popup += `
    <div class="image-carousel">
      <img
        class="popup-img"
        id="carousel-${spotId}"
        src="${imageUrls[0]}"
        onclick="openImageModal(this.src)"
      >
  `;

  if (imageUrls.length > 1) {
    popup += `
      <div class="carousel-buttons">
        <button onclick="changeCarouselImage('${spotId}', '${imageUrls[0]}')">1</button>
        <button onclick="changeCarouselImage('${spotId}', '${imageUrls[1]}')">2</button>
      </div>
    `;
  }

  popup += `</div>`;
}

          if (data["動画"]) {
            popup += `<br><a href="${data["動画"]}" target="_blank">動画を見る</a>`;
          }

         const marker = L.marker([lat, lng], { icon: markerIcon })
  .bindPopup(popup);

          allSpots.push({
  title: data["タイトル"] || data["名前"],
  marker: marker
});

marker.category = category;

marker.addTo(map);

markers.push(marker);
          
        });
      });

    const legend = L.control({ position: 'topleft' });

    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
<div class="legend-title">📖 カテゴリ</div>

<label><input type="checkbox" checked value="温泉"> 🔴 温泉</label><br>
<label><input type="checkbox" checked value="絶景"> 🔵 絶景</label><br>
<label><input type="checkbox" checked value="風景"> 🟢 風景</label><br>
<label><input type="checkbox" checked value="グルメ"> 🟠 グルメ</label><br>
<label><input type="checkbox" checked value="レジャー"> 🟣 レジャー</label><br>
<label><input type="checkbox" checked value="自然農"> 🟡 自然農</label><br>
<label><input type="checkbox" checked value="神社・伝統"> ⛩️ 神社・伝統</label><br>
<label><input type="checkbox" checked value="動物"> 🐾 動物</label><br>
<label><input type="checkbox" checked value="イベント"> 🎆 イベント</label><br>
<label><input type="checkbox" checked value="幸せシェア"> 🌈 幸せシェア</label>
`;
      setTimeout(() => {

  document.querySelectorAll('.legend input').forEach(cb => {

    cb.addEventListener('change', () => {

      const category = cb.value;

      if (cb.checked) {
        activeCategories.add(category);
      } else {
        activeCategories.delete(category);
      }

      markers.forEach(marker => {

        if (activeCategories.has(marker.category)) {

          if (!map.hasLayer(marker)) {
            marker.addTo(map);
          }

        } else {

          if (map.hasLayer(marker)) {
            map.removeLayer(marker);
          }

        }

      });

    });

  });

}, 500); 
      return div;
    };

    legend.addTo(map);
    function openImageModal(src) {
  document.getElementById('modalImage').src = src;
  document.getElementById('imageModal').style.display = 'flex';
}

function closeImageModal() {
  document.getElementById('imageModal').style.display = 'none';
}

function sendThanks(button) {
  const message = button.nextElementSibling;

  button.style.display = "none";

  message.style.display = "inline-block";

  message.textContent = "ありがとうを届けました🌈";
}

    function changeCarouselImage(spotId, imageUrl) {
  const img = document.getElementById(`carousel-${spotId}`);

  if (img) {
    img.src = imageUrl;
  }
}
    
function updatePrefectureList() {

  const legend = document.querySelector('.legend');

  if (!legend) return;

  let html = '<hr><div class="legend-title">🗾 都道府県別</div>';

  Object.entries(prefectureCounts)
    .sort((a, b) => b[1] - a[1])
    .forEach(([pref, count]) => {
      html += `${pref} ${count}件<br>`;
    });

  legend.insertAdjacentHTML('beforeend', html);
}

function searchPlace() {

  const keyword = document
    .getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  const found = allSpots.find(spot =>
    spot.title &&
    spot.title.toLowerCase().includes(keyword)
  );

  if (found) {
    map.setView(found.marker.getLatLng(), 12);
    found.marker.openPopup();
  } else {
    alert("見つかりませんでした");
  }
}
    
  </script>
</body>
</html>
