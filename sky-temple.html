<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天空の神殿</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: url("images/sky-temple.png") center top no-repeat;
  background-size: cover;
  color: #000;
  text-align: center;
  min-height: 100vh;
}

.temple {
  max-width: 760px;
  margin: 0 auto;
  padding: 55px 8px 170px;
}

h1 {
  font-size: 73px;
  margin: 0 0 10px;
  font-weight: 900;
  color: #4B0082

  text-shadow:
    0 0 8px white,
    0 0 16px white;
}

.mainTitle {
  font-size: 50px;
  margin-bottom: 0;
  font-weight: 900;
  color: #000;
  text-shadow:
    0 0 8px white,
    0 0 16px white;
}

/* ランキング全体を噴水の下あたりへ */
.rankingArea {
  margin-top: 380px;
}

.member {
  margin: 28px auto 44px;
  color: #000;
  text-shadow:
    0 0 7px white,
    0 0 14px white,
    0 0 22px white;
}

.memberName {
  font-size: 64px;
  line-height: 1.15;
  font-weight: 900;
}

.memberText {
  font-size: 38px;
  line-height: 1.35;
  font-weight: 900;
}

/* 戻るボタン：宝物地図っぽい丸ボタン風 */
.backButton {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);

  display: inline-block;
  padding: 14px 28px;
  border-radius: 999px;

  background:
    radial-gradient(circle at center, #ffffff 0%, #ffffff 55%, #e8fff1 100%);
  color: #256b3b;
  text-decoration: none;

  font-size: 28px;
  font-weight: 900;

  border: 3px solid #9fd8b2;

  box-shadow:
    0 0 10px white,
    0 0 20px rgba(255,255,255,0.95),
    0 0 28px rgba(120,210,160,0.75);

  z-index: 9999;
}
</style>
</head>

<body>

<div class="temple">

  <h1>🏛️天空の神殿🏛️</h1>

  <div class="mainTitle">
    🌈宝物を届けてくれた人たち🌈
  </div>

  <div class="rankingArea">

    <div class="member">
      <div class="memberName">🏅ちえちゃん</div>
      <div class="memberText">12個の宝物を届けてくれました🌸</div>
    </div>

    <div class="member">
      <div class="memberName">🥈○○さん</div>
      <div class="memberText">8個の宝物を届けてくれました🌱</div>
    </div>

    <div class="member">
      <div class="memberName">🥉○○さん</div>
      <div class="memberText">5個の宝物を届けてくれました🌈</div>
    </div>

  </div>

  <a class="backButton" href="index.html?return=true">🌎宝物地図へ戻る</a>

</div>

</body>
</html>
