<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天空の神殿</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;

  background: url("images/sky-temple.png") center top no-repeat;
  background-size: cover;
  background-attachment: scroll;

  color: #235842;
  text-align: center;

  min-height: 100vh;
}

.temple {
  max-width: 760px;
  margin: 0 auto;
  padding-top: 160px;
  padding-left: 15px;
  padding-right: 15px;
  padding-bottom: 160px;
}
h1 {
  font-size: 56px;
}

.clouds {
  font-size: 30px;
  letter-spacing: 8px;
  margin: 6px 0;
}

.mainTitle {
  font-size: 40px;
}

.lead {
  font-size: 30px;
}

.member {
  font-size: 38px;
  margin: 30px auto;
  line-height: 1.45;
}

.medal {
  font-size: 58px;
}

.backButton {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);

  display: inline-block;
  padding: 16px 34px;
  border-radius: 999px;
  background: #e8fff1;
  color: #256b3b;
  text-decoration: none;
  font-weight: 900;
  font-size: 26px;
  border: 3px solid #9fd8b2;
  box-shadow: 0 0 18px rgba(255,255,255,0.95);
  z-index: 9999;
}
</style>
</head>

<body>

<div class="temple">

  <div class="clouds">☁️ ☁️ ☁️</div>

  <h1>🏛️天空の神殿🏛️</h1>

  <div class="clouds">✨ ☁️ ✨</div>

  <div class="mainTitle">
    🌈宝物を届けてくれた人たち🌈
  </div>

  <p class="lead">
    日本中へ素敵な宝物を届けてくれた<br>
    仲間たちの記録が刻まれています✨
  </p>

  <div class="member">
    <span class="medal">🥇</span>
    ちえちゃん<br>
    12個の宝物を届けてくれました🌸
  </div>

  <div class="member">
    <span class="medal">🥈</span>
    ○○さん<br>
    8個の宝物を届けてくれました🌱
  </div>

  <div class="member">
    <span class="medal">🥉</span>
    ○○さん<br>
    5個の宝物を届けてくれました🌈
  </div>

  <a class="backButton" href="index.html?return=true">🌎宝物地図へ戻る</a>

</div>

</body>
</html>
