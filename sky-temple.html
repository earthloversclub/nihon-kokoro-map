<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天空の神殿</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;

  background: url("images/sky-temple.png") center top no-repeat;
  background-size: cover;
  background-attachment: scroll;

  color: #235842;
  text-align: center;

  min-height: 100vh;
}

.temple {
  max-width: 760px;
  margin: 0 auto;

  padding-top: 160px;
  padding-left: 15px;
  padding-right: 15px;
  padding-bottom: 80px;
}

h1 {
  font-size: 46px;
  margin: 8px 0 8px;
  color: #245b45;
  text-shadow: 0 0 10px white;
}

.clouds {
  font-size: 30px;
  letter-spacing: 8px;
  margin: 6px 0;
}

.mainTitle {
  font-size: 34px;
  font-weight: 900;
  line-height: 1.4;
  margin: 22px 0 14px;
  text-shadow: 0 0 8px white;
}

.lead {
  font-size: 24px;
  font-weight: 900;
  line-height: 1.7;
  margin: 0 auto 28px;
}

.member {
  max-width: 620px;
  margin: 24px auto;
  padding: 18px 10px 22px;
  font-size: 30px;
  font-weight: 900;
  line-height: 1.5;

  border-top: 4px solid rgba(255,215,120,0.9);
  border-bottom: 4px solid rgba(255,215,120,0.9);

  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.88),
    transparent
  );

  text-shadow:
    0 0 6px white,
    0 0 12px white;
}

.medal {
  display: block;
  font-size: 46px;
  margin-bottom: 4px;
}

.backButton {
  display: inline-block;
  margin-top: 28px;
  padding: 16px 30px;
  border-radius: 999px;
  background: #e8fff1;
  color: #256b3b;
  text-decoration: none;
  font-weight: 900;
  font-size: 22px;
  border: 3px solid #9fd8b2;
  box-shadow: 0 0 14px rgba(255,255,255,0.9);
}
</style>
</head>

<body>

<div class="temple">

  <div class="clouds">☁️ ☁️ ☁️</div>

  <h1>🏛️天空の神殿🏛️</h1>

  <div class="clouds">✨ ☁️ ✨</div>

  <div class="mainTitle">
    🌈宝物を届けてくれた人たち🌈
  </div>

  <p class="lead">
    日本中へ素敵な宝物を届けてくれた<br>
    仲間たちの記録が刻まれています✨
  </p>

  <div class="member">
    <span class="medal">🥇</span>
    ちえちゃん<br>
    12個の宝物を届けてくれました🌸
  </div>

  <div class="member">
    <span class="medal">🥈</span>
    ○○さん<br>
    8個の宝物を届けてくれました🌱
  </div>

  <div class="member">
    <span class="medal">🥉</span>
    ○○さん<br>
    5個の宝物を届けてくれました🌈
  </div>

  <a class="backButton" href="index.html?return=true">🌎宝物地図へ戻る</a>

</div>

</body>
</html>
