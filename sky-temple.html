<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天空の神殿</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: url("images/sky-temple.png") center top no-repeat;
  background-size: cover;
  color: #000;
  text-align: center;
  min-height: 100vh;
}

.temple {
  width: 100%;
  margin: 0 auto;
  padding: 55px 8px 170px;
  box-sizing: border-box;
}

/* 天空の神殿 */
h1 {
  font-size: 77px;
  margin: 40px 0 20px;
  font-weight: 900;
  color: #2E0854;

  text-shadow:
    0 0 8px white,
    0 0 16px white,
    0 0 28px rgba(46, 8, 84, 0.55);
}

/* 宝物を届けてくれた人たち */
h2 {
  font-size: 55px;
  margin: 20px 0 35px;
  font-weight: 900;
  color: #6A1B9A;
  margin-bottom: 90px;
  line-height: 1.1;
  white-space: nowrap;

  text-shadow:
    0 0 8px white,
    0 0 16px white,
    0 0 28px rgba(46, 8, 84, 0.55);
}

.templeMessage {
  font-size: 40px;
  font-weight: 900;
  color: #2E0854;
  line-height: 1.45;

  margin-top: 15px;
  margin-bottom: 100px;

  text-shadow:
    0 0 8px white,
    0 0 16px white,
    0 0 28px rgba(46, 8, 84, 0.55);
}

/* ランキング全体の位置 */
.rankingArea {
  margin-top: 420px;
}

.member {
  margin: 28px auto 44px;
  color: #2E0854;

  text-shadow:
    0 0 7px white,
    0 0 14px white,
    0 0 22px white;
}

.memberName {
  font-size: 64px;
  line-height: 1.15;
  font-weight: 900;
}

.memberText {
  font-size: 45px;
  color: #0000CD;
  line-height: 1.35;
  font-weight: 900;
}

.backButton {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);

  display: inline-block;
  padding: 14px 28px;
  border-radius: 999px;

  background:
    radial-gradient(circle at center, #ffffff 0%, #ffffff 55%, #e8fff1 100%);

  color: #256b3b;
  text-decoration: none;

  font-size: 40px;
  font-weight: 900;

  border: 3px solid #9fd8b2;

  box-shadow:
    0 0 10px white,
    0 0 20px rgba(255,255,255,0.95),
    0 0 28px rgba(120,210,160,0.75);

  z-index: 9999;
}
</style>
</head>

<body>

<div class="temple">

  <h1>🏛️天空の神殿🏛️</h1>

  <h2>🌈宝物を届けてくれた人たち🌈</h2>

  <p class="templeMessage">
    日本中へ素敵な宝物を届けてくれた<br>
    仲間たちの記録がここに刻まれています✨
  </p>

  <div class="rankingArea">

    <div class="member">
      <div class="memberName">🏅テスト</div>
      <div class="memberText">12個の宝物を届けてくれました🌸</div>
    </div>

    <div class="member">
      <div class="memberName">🥈○○さん</div>
      <div class="memberText">8個の宝物を届けてくれました🌱</div>
    </div>

    <div class="member">
      <div class="memberName">🥉○○さん</div>
      <div class="memberText">5個の宝物を届けてくれました🌈</div>
    </div>

  </div>

  <a class="backButton" href="index.html?return=true">🌎宝物地図へ戻る</a>

</div>

<script>
const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v4QCNsKzTus67itmVJ4NY45nYz_QLW40OWRXj9XjDkM/pub?output=csv";

function splitCSVLine(line) {
  return line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)?.map(v =>
    v.replace(/^"|"$/g, "").trim()
  ) || [];
}

fetch(sheetUrl)
  .then(res => res.text())
  .then(csv => {
    const rows = csv.trim().split(/\r?\n/).map(splitCSVLine);
    const headers = rows[0];

    const posterIndex = headers.findIndex(h =>
  h.replace(/^\uFEFF/, "").replace(/\s/g, "").includes("投稿者")
);

    if (posterIndex === -1) {
      alert("投稿者列が見つかりません");
      return;
    }

    const counts = {};

    rows.slice(1).forEach(row => {
      const name = (row[posterIndex] || "").trim();

      if (!name) return;
      if (name === "未入力") return;

      counts[name] = (counts[name] || 0) + 1;
    });

    const ranking = Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3);

    if (ranking.length === 0) {
      alert("投稿者データが見つかりません");
      return;
    }

    const medals = ["🏅", "🥈", "🥉"];
    const flowers = ["🌸", "🌱", "🌈"];

    document.querySelectorAll(".member").forEach((box, i) => {
      if (!ranking[i]) {
        box.style.display = "none";
        return;
      }

      const name = ranking[i][0];
      const count = ranking[i][1];

      box.querySelector(".memberName").textContent = `${medals[i]}${name}`;
      box.querySelector(".memberText").textContent =
        `${count}個の宝物を届けてくれました${flowers[i]}`;
    });
  })
  .catch(err => {
    alert("ランキング読み込みエラー");
    console.log(err);
  });
</script>
  
</body>
</html>
