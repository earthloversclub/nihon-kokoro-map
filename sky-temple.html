<script>
const sheetUrl = "https://script.google.com/macros/s/AKfycbybLspt-tzGEuWKZuEi4dukk4chmcU03jwS0_F9vuhbkW2RkpfXK8KOpSot8Za8BE6r/exec?action=mapCsv";
const heartCsvUrl = "https://script.google.com/macros/s/AKfycbybLspt-tzGEuWKZuEi4dukk4chmcU03jwS0_F9vuhbkW2RkpfXK8KOpSot8Za8BE6r/exec?action=heartCsv";

const DEBUG_MODE = false;

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      row.push(cell);
      cell = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
      if (char === "\r" && next === "\n") i++;
    } else {
      cell += char;
    }
  }

  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

function addPosterCounts(rows, counts) {
  const headers = rows[0];

  rows.slice(1).forEach(row => {
    const data = {};

    headers.forEach((h, i) => {
      const key = h.replace(/\s/g, "").trim();
      data[key] = row[i];
    });

    const name = (data["投稿者"] || "").trim();

    if (!name) return;
    if (name === "未入力") return;
    if (name === "匿名") return;

    counts[name] = (counts[name] || 0) + 1;
  });
}

function loadRows(loader) {
  return new Promise((resolve, reject) => {
    try {
      loader(function(rows, headers) {
        if (!Array.isArray(rows)) {
          reject(new Error("rows is not array"));
          return;
        }

        const firstRow = rows[0] || [];
        const hasHeaderRow =
          Array.isArray(firstRow) &&
          firstRow.some(h => String(h).replace(/\s/g, "").trim() === "投稿者");

        if (!hasHeaderRow && Array.isArray(headers)) {
          resolve([headers, ...rows]);
          return;
        }

        resolve(rows);
      });
    } catch (error) {
      reject(error);
    }
  });
}

Promise.all([
  loadRows(loadMapData),
  loadRows(loadHeartData)
])
.then(([treasureRows, heartRows]) => {
  const counts = {};

  addPosterCounts(treasureRows, counts);
  addPosterCounts(heartRows, counts);

  const ranking = Object.entries(counts)
    .sort((a, b) => b[1] - a[1]);

  const top5 = ranking.slice(0, 5);
  const bottom5 = ranking.slice(5, 10);
  const totalPosts = treasureRows.length - 1 + heartRows.length - 1;

  if (ranking.length === 0) {
    alert("ランキングに表示できる投稿者がいません");
    return;
  }

  const medals = [
    "🏆",
    "🥈",
    "🥉",
    "🌈",
    "🌞",
    "🌟",
    "🐬",
    "🌸",
    "🐦",
    "🍓"
  ];

  function createMemberHtml(item, index) {
    const name = item ? item[0] : "";
    const count = item ? item[1] : "";

    return `
      <div class="member">
        <div class="memberName">
          <span class="medalIcon ${index < 3 ? "topMedal" : ""}">
            ${medals[index]}
          </span>
          <span class="memberRealName">${name}</span>
        </div>

        <div class="memberText">
          ${name ? `${count}個の宝物を届けてくれました💐` : ""}
        </div>
      </div>
    `;
  }

  document.querySelector(".topRankingArea").innerHTML =
    Array.from({ length: 5 }, (_, i) => createMemberHtml(top5[i], i)).join("");

  const thanksMessage = `
    <div class="thanksMessage">

🌸🌼🌸🌼🌸🌼🌸🌼🌸🌼🌸🌼🌸🌼🌸<br><br>

      🍀宝物を届けてくれた<br>
      すべての仲間たちへ🍀<br><br>

      貴方が大切だと感じた想いが<br>
      誰かの心の希望になり<br><br>

      届けたいとおもったその心が<br>
      人と人に紡がれて<br><br>
　未来を創る軌跡になる🌈<br><br>

    🌼🌸🌼🌸🌼🌸🌼🌸🌼🌸🌼🌸🌼🌸🌼<br><br>

    </div>
  `;

  document.querySelector(".bottomRankingArea").innerHTML =
    Array.from({ length: 5 }, (_, i) => createMemberHtml(bottom5[i], i + 5)).join("");

  document.querySelector(".thanksArea").innerHTML = thanksMessage;
  setupSpecialThanks(totalPosts);

  document.querySelector(".topRankingArea").style.visibility = "visible";
  document.querySelector(".bottomRankingArea").style.visibility = "visible";
  document.body.classList.remove("temple-loading");
  document.body.classList.add("temple-ready");
})
.catch(err => {
  alert("ランキング読み込みエラー");
  console.log(err);
});

function setupSpecialThanks(totalPosts) {
  const btn = document.getElementById("specialThanksBtn");
  const img = document.getElementById("specialThanksImage");
  const title = document.querySelector(".heartTitle");
  const count = document.querySelector(".heartCount");

  if (!btn || !img || !title || !count) return;

  const angelMilestones = [111, 222, 333, 444, 555, 666, 777, 888, 999];

  if (DEBUG_MODE) {
    const debugMilestone = 111;

    img.src = "images/special-thanks-open.png";
    title.textContent = "Special⭐Thanks";
    count.innerHTML = `👼${debugMilestone}エンジェルナンバー達成👼<br>✨押して祝福する✨`;

    btn.classList.remove("locked");
    btn.style.pointerEvents = "auto";
    btn.style.cursor = "pointer";

    btn.onclick = function() {
      showSpecialThanksEffect(debugMilestone);
    };

    return;
  }

  const availableMilestone = angelMilestones.find(function(n) {
    return totalPosts >= n && !localStorage.getItem("specialThanks_" + n);
  });

  if (!availableMilestone) {
    const nextMilestone = angelMilestones.find(function(n) {
      return totalPosts < n;
    });

    if (nextMilestone) {
      img.src = "images/special-thanks-lock.png";
      title.textContent = "Special⭐Thanks";
      count.innerHTML = `👼${nextMilestone}投稿達成まで👼<br>あと${nextMilestone - totalPosts}投稿`;

      btn.classList.add("locked");
      btn.onclick = null;
      return;
    }

    img.src = "images/special-thanks-open.png";
    title.textContent = "";
    count.innerHTML = "";

    btn.classList.add("locked");
    btn.onclick = null;
    return;
  }

  img.src = "images/special-thanks-open.png";
  title.textContent = "Special⭐Thanks";
  count.innerHTML = `👼${availableMilestone}エンジェルナンバー達成👼<br>✨押して祝福する✨`;

  btn.classList.remove("locked");
  btn.style.pointerEvents = "auto";
  btn.style.cursor = "pointer";

  btn.onclick = function() {
    localStorage.setItem("specialThanks_" + availableMilestone, "done");

    btn.classList.add("locked");
    btn.onclick = null;

    showSpecialThanksEffect(availableMilestone);
  };
}
function showSpecialThanksEffect(milestone) {

setTimeout(() => {

const EFFECT_COUNT = 210;

const EFFECT_RATE = {
  light:50,     // ✨
  sakura:25,    // 🌸
  clover:20,    // 🍀
  feather:20    // 🪽
};
  
for(let i=0;i<EFFECT_COUNT;i++){

  p.className="lightParticle";
const r = Math.random() * 100;

if (r < EFFECT_RATE.light) {

  // 本物の光の粒
  p.innerHTML = "";
  p.style.width = "12px";
  p.style.height = "12px";
  p.style.borderRadius = "50%";
  p.style.background = "white";

  p.style.boxShadow =

    "0 0 35px #fff7b8";

}
else{

}

  const angle=Math.random()*Math.PI*2;
