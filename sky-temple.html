<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天空の神殿</title>

<style>
  
body {
  margin: 0;
  font-family: sans-serif;
  background: #eef7ff;
  color: #000;
  text-align: center;
  min-height: 100vh;
}
  color: #000;
  text-align: center;
  min-height: 100vh;
}

.templeTop {
  width: 100%;
  margin: 0 auto;
  padding: 55px 8px 170px;
  box-sizing: border-box;
}

/* 天空の神殿 */
h1 {
  font-size: 77px;
  margin: 40px 0 20px;
  font-weight: 900;
  color: #2E0854;

  text-shadow:
    0 0 8px white,
    0 0 16px white,
    0 0 28px rgba(46, 8, 84, 0.55);
}

/* 宝物を届けてくれた人たち */
h2 {
  font-size: 55px;
  margin: 20px 0 35px;
  font-weight: 900;
  color: #6A1B9A;
  margin-bottom: 90px;
  line-height: 1.1;
  white-space: nowrap;

  text-shadow:
    0 0 8px white,
    0 0 16px white,
    0 0 28px rgba(46, 8, 84, 0.55);
}

.templeMessage {
  font-size: 45px;
  font-weight: 900;
  color: #2E0854;
  line-height: 1.45;

  margin-top: 20px;
  margin-bottom: 100px;

  text-shadow:
    0 0 8px white,
    0 0 16px white,
    0 0 28px rgba(46, 8, 84, 0.55);
}

/* ランキング全体の位置 */
.topRankingArea {
  margin-top: 420px;
  visibility: hidden;
}

.bottomRankingArea {
  margin-top: 80px;
  visibility: hidden;
}
  
.member {
  margin: 28px auto 44px;
  color: #2E0854;

  text-shadow:
    0 0 7px white,
    0 0 14px white,
    0 0 22px white;
}

.memberName {
  font-size: 64px;
  line-height: 1.15;
  font-weight: 900;

  display: inline-block;
  position: relative;
}

.medalIcon {
  position: absolute;
  right: calc(100% + 14px);
  top: 50%;
  transform: translateY(-50%);
  width: 70px;
  text-align: right;
}

.memberRealName {
  display: inline-block;
}

.memberText {
  font-size: 45px;
  color: #0000CD;
  line-height: 1.35;
  font-weight: 900;
}

@keyframes heroGlow {

  0%,100%{
    text-shadow:
      0 0 8px white,
      0 0 15px white,
      0 0 25px rgba(255,255,255,0.8);
  }

  50%{
    text-shadow:
      0 0 15px white,
      0 0 30px white,
      0 0 50px rgba(255,255,255,1);
  }

}

.backButton {
display: inline-block;
margin: 10px auto 30px;

  padding: 18px 40px;

  font-size: 42px;
  font-weight: 900;

  color: #256b3b;
  text-decoration: none;

  border-radius: 999px;
  border: 4px solid #9fd8b2;

  background:
    radial-gradient(circle at center,
      #ffffff 0%,
      #ffffff 55%,
      #e8fff1 100%);

  box-shadow:
    0 0 15px white,
    0 0 30px rgba(255,255,255,0.95),
    0 0 45px rgba(120,210,160,0.8);

}

.thanksMessage{
  margin:220px auto 220px;
  font-size:48px;
  font-weight:900;
  line-height:1.35;
  color:#2E0854;

  text-shadow:
    0 0 8px white,
    0 0 16px white,
    0 0 28px rgba(46,8,84,0.55);
}

.templeTop {
  background: url("images/sky-temple.png") center top no-repeat;
  background-size: cover;
  min-height: 100vh;
}

.templeBottom {
  background: url("images/sky-temple2.png") center top repeat-y;
  background-size: 100% auto;
  min-height: 100vh;
}

.medalIcon {
  display: inline-block;
  width: 70px;
  text-align: right;
}

.memberRealName {
  display: inline-block;
  text-align: left;
}
  
.topMedal{
  font-size: 1.25em;
}
  
</style>
</head>

<body>

<div class="templeTop">

  <h1>🏛️天空の神殿🏛️</h1>

  <h2>🌈宝物を届けてくれた人たち🌈</h2>

  <p class="templeMessage">
    日本中へ素敵な宝物を届けてくれた<br>
    仲間たちの記録がここに刻まれています✨
  </p>

  <div class="topRankingArea"></div>

</div>

<div class="templeBottom">

  <div class="bottomRankingArea"></div>

  <a class="backButton" href="index.html?return=true">🌎宝物地図へ戻る</a>

</div>

<script>
const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v40CNsKzTus67itmVJ4NY45nYz_QLW400WRXj9XjDkM/pub?output=csv";  
const heartCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v40CNsKzTus67itmVJ4NY45nYz_QLW400WRXj9XjDkM/pub?gid=247430186&single=true&output=csv";

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      row.push(cell);
      cell = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
      if (char === "\r" && next === "\n") i++;
    } else {
      cell += char;
    }
  }

  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

function addPosterCounts(rows, counts) {
  const headers = rows[0];

  rows.slice(1).forEach(row => {
    const data = {};

    headers.forEach((h, i) => {
      const key = h.replace(/\s/g, "").trim();
      data[key] = row[i];
    });

    const name = (data["投稿者"] || "").trim();

    if (!name) return;
    if (name === "未入力") return;
    if (name === "匿名") return;

    counts[name] = (counts[name] || 0) + 1;
  });
}

Promise.all([
  fetch(sheetUrl + "&t=" + Date.now()).then(response => response.text()),
  fetch(heartCsvUrl + "&t=" + Date.now()).then(response => response.text())
])
.then(([treasureCsv, heartCsv]) => {
  const treasureRows = parseCSV(treasureCsv);
  const heartRows = parseCSV(heartCsv);

  const counts = {};

  addPosterCounts(treasureRows, counts);
  addPosterCounts(heartRows, counts);

  const ranking = Object.entries(counts)
  .sort((a, b) => b[1] - a[1]);

const top5 = ranking.slice(0, 5);
const bottom5 = ranking.slice(5, 10);

  if (ranking.length === 0) {
    alert("ランキングに表示できる投稿者がいません");
    return;
  }

const medals = [
  "🏆",
  "🥈",
  "🥉",
  "🌈",
  "🌞",
  "🌟",
  "🐬",
  "🌸",
  "🐦",
  "🍓"
];

function createMemberHtml(item, index) {

  const name = item ? item[0] : "";
  const count = item ? item[1] : "";

  return `
    <div class="member">
      <div class="memberName">
        <span class="medalIcon ${index < 3 ? "topMedal" : ""}">
  ${medals[index]}
</span>
        <span class="memberRealName">${name}</span>
      </div>

      <div class="memberText">
        ${name ? `${count}個の宝物を届けてくれました💐` : ""}
      </div>
    </div>
  `;
}
document.querySelector(".topRankingArea").innerHTML =
  Array.from({ length: 5 }, (_, i) => createMemberHtml(top5[i], i)).join("");

const thanksMessage = `
  <div class="thanksMessage">
    🌈 宝物を届けてくれた<br>
    すべての仲間たちへ 🌈<br><br>

    ひとつひとつの投稿が<br>
    誰かの心に安らぎを与え<br><br>

    日本中に優しい光が<br>
    広がっていきます✨<br><br>
　みなさまに輝かしい未来が<br>
  訪れますように🍀
  </div>
`;

document.querySelector(".bottomRankingArea").innerHTML =
  Array.from({ length: 5 }, (_, i) => createMemberHtml(bottom5[i], i + 5)).join("") + thanksMessage;

document.querySelector(".topRankingArea").style.visibility = "visible";
document.querySelector(".bottomRankingArea").style.visibility = "visible";
})
.catch(err => {
  alert("ランキング読み込みエラー");
  console.log(err);
});
</script>
  
</body>
</html>
