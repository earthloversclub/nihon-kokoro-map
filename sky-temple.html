<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天空の神殿</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: url("images/sky-temple.png") center top no-repeat;
  background-size: cover;
  color: #000;
  text-align: center;
  min-height: 100vh;
}

.temple {
  max-width: 760px;
  margin: 0 auto;
  padding: 55px 8px 170px;
}
  
h1 {
  font-size: 75px;
  margin: 40px 0 20px;           /* ← ここで調整してください */
  font-weight: 900;
  color: #2E0854 !important;
  
  text-shadow:
    0 0 8px white,
    0 0 16px white;
}
  
.mainTitle {
  font-size: 78px;           /* 大きくした（画面幅に合わせて調整可能） */
  margin: 20px 0 35px 0;
  font-weight: 900;
  color: #2E0854;            /* 濃い紫に統一 */
  white-space: nowrap;       /* 改行を防ぐ */
  line-height: 1.1;
  
  text-shadow:
    0 0 10px #ffffff,
    0 0 20px #ffffff,
    0 0 35px #2E0854,
    0 0 50px rgba(46, 8, 84, 0.6);
}

.templeMessage {
  text-align: center;
  font-size: 38px;           /* 24px → 38px に大きく */
  font-weight: 700;
  color: #2E0854;            /* 紫に統一 */
  margin-top: 15px;
  margin-bottom: 100px;
  
  text-shadow:
    0 0 10px #ffffff,
    0 0 20px #ffffff,
    0 0 30px rgba(46, 8, 84, 0.7);
}
  
.rankingArea {
  margin-top: 500px;
}

.member {
  margin: 28px auto 44px;
  color: #000;
  text-shadow:
    0 0 7px white,
    0 0 14px white,
    0 0 22px white;
}

.memberName {
  font-size: 64px;
  line-height: 1.15;
  font-weight: 900;
}

.memberText {
  font-size: 45px;
  line-height: 1.35;
  font-weight: 900;
}

/* 戻るボタン：宝物地図っぽい丸ボタン風 */
.backButton {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);

  display: inline-block;
  padding: 14px 28px;
  border-radius: 999px;

  background:
    radial-gradient(circle at center, #ffffff 0%, #ffffff 55%, #e8fff1 100%);
  color: #256b3b;
  text-decoration: none;

  font-size: 35px;
  font-weight: 900;

  border: 3px solid #9fd8b2;

  box-shadow:
    0 0 10px white,
    0 0 20px rgba(255,255,255,0.95),
    0 0 28px rgba(120,210,160,0.75);

  z-index: 9999;
}
</style>
</head>

<body>

<div class="temple">

<h1>🏛️天空の神殿🏛️</h1>

<h2>🌈宝物を届けてくれた人たち🌈</h2>

<p class="templeMessage">
日本中へ素敵な宝物を届けてくれた<br>
仲間たちの記録が刻まれています✨
</p>
  
  <div class="rankingArea">

    <div class="member">
      <div class="memberName">🏅ちえちゃん</div>
      <div class="memberText">12個の宝物を届けてくれました🌸</div>
    </div>

    <div class="member">
      <div class="memberName">🥈○○さん</div>
      <div class="memberText">8個の宝物を届けてくれました🌱</div>
    </div>

    <div class="member">
      <div class="memberName">🥉○○さん</div>
      <div class="memberText">5個の宝物を届けてくれました🌈</div>
    </div>

  </div>

  <a class="backButton" href="index.html?return=true">🌎宝物地図へ戻る</a>

</div>

</body>
</html>
