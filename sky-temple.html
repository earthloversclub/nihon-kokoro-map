}

.specialThanksButton{
  position: relative;
  width: 380px;
  margin: 0 auto;
  cursor: pointer;
}

.heartText{
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -48%);
  width: 78%;
  text-align: center;

  font-size: 24px;
  font-weight: 900;
  line-height: 1.25;
  color: #7a1f45;

  text-shadow:
    0 0 6px white,
    0 0 12px white;
}

.specialThanksButton.locked{
  opacity: 0.7;
  cursor: not-allowed;
}

.topRankingArea,
.bottomRankingArea {
  visibility: visible !important;
}

.member {
  margin: 28px auto 44px;
  color: #2E0854;
  text-shadow:
    0 0 7px white,
    0 0 14px white,
    0 0 22px white;
}

.memberName {
  font-size: 64px;
  line-height: 1.15;
  font-weight: 900;
  display: inline-block;
  position: relative;
}

.memberText {
  font-size: 45px;
  color: #0000CD;
  line-height: 1.35;
  font-weight: 900;

<body>

<div class="templeTop">

  <h1>🏛️天空の神殿🏛️</h1>

  <h2>🌈宝物を届けてくれた人たち🌈</h2>

  <p class="templeMessage">
    日本中へ素敵な宝物を届けてくれた<br>
    仲間たちの記録がここに刻まれています✨
  </p>

  <div class="topRankingArea"></div>

</div>

<div class="templeBottom">

<div class="bottomRankingArea"></div>

<div class="specialThanksArea">
 <div id="specialThanksBtn" class="specialThanksButton">

  <img
    id="specialThanksImage"
    src="images/special-thanks-lock.png"
  >

  <div id="specialThanksText" class="heartText">
    ❤Special Thanks❤<br>
    100投稿まで<br>
    あと79投稿
  </div>

</div>

  <div class="specialThanksNote">
    ※条件を満たせば押せるボタン♪
  </div>
</div>

<div class="thanksArea"></div>

<div class="buttonArea">
  <a class="backButton" href="index.html?return=true">🌎宝物地図へ戻る</a>
</div>

</div>
  
<script>
const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v40CNsKzTus67itmVJ4NY45nYz_QLW400WRXj9XjDkM/pub?output=csv";  
const heartCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v40CNsKzTus67itmVJ4NY45nYz_QLW400WRXj9XjDkM/pub?gid=247430186&single=true&output=csv";

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      row.push(cell);
      cell = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
      if (char === "\r" && next === "\n") i++;
    } else {
      cell += char;
    }
  }

  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

function addPosterCounts(rows, counts) {
  const headers = rows[0];

  rows.slice(1).forEach(row => {
    const data = {};

    headers.forEach((h, i) => {
      const key = h.replace(/\s/g, "").trim();
      data[key] = row[i];
    });

    const name = (data["投稿者"] || "").trim();

    if (!name) return;
    if (name === "未入力") return;
    if (name === "匿名") return;

    counts[name] = (counts[name] || 0) + 1;
  });
}

Promise.all([
  fetch(sheetUrl + "&t=" + Date.now()).then(response => response.text()),
  fetch(heartCsvUrl + "&t=" + Date.now()).then(response => response.text())
])
.then(([treasureCsv, heartCsv]) => {
  const treasureRows = parseCSV(treasureCsv);
  const heartRows = parseCSV(heartCsv);

  const counts = {};

  addPosterCounts(treasureRows, counts);
  addPosterCounts(heartRows, counts);

  const ranking = Object.entries(counts)
  .sort((a, b) => b[1] - a[1]);

const top5 = ranking.slice(0, 5);
const bottom5 = ranking.slice(5, 10);
const totalPosts = treasureRows.length - 1 + heartRows.length - 1;  

  if (ranking.length === 0) {
    alert("ランキングに表示できる投稿者がいません");
    return;
  }

const medals = [
  "🏆",
  "🥈",
  "🥉",
  "🌈",
  "🌞",
  "🌟",
  "🐬",
  "🌸",
  "🐦",
  "🍓"
];

function createMemberHtml(item, index) {

  const name = item ? item[0] : "";
  const count = item ? item[1] : "";

  return `
    <div class="member">
      <div class="memberName">
        <span class="medalIcon ${index < 3 ? "topMedal" : ""}">
  ${medals[index]}
</span>
        <span class="memberRealName">${name}</span>
      </div>

      <div class="memberText">
        ${name ? `${count}個の宝物を届けてくれました💐` : ""}
      </div>
    </div>
  `;
}
document.querySelector(".topRankingArea").innerHTML =
  Array.from({ length: 5 }, (_, i) => createMemberHtml(top5[i], i)).join("");

const thanksMessage = `
  <div class="thanksMessage">
    🌈 宝物を届けてくれた<br>
    すべての仲間たちへ 🌈<br><br>

    ひとつひとつの投稿が<br>
    誰かの心に安らぎを与え<br><br>

    日本中に優しい光が<br>
    広がっていきます✨<br><br>
　みなさまに輝かしい未来が<br>
  訪れますように🍀<br><br>
  🌸🌼🌸🌼🌸🌼🌸🌼🌸🌼🌸🌼🌸🌼🌸🌼🌸<br>
  
  </div>
`;

document.querySelector(".bottomRankingArea").innerHTML =
  Array.from({ length: 5 }, (_, i) => createMemberHtml(bottom5[i], i + 5)).join("");

document.querySelector(".thanksArea").innerHTML = thanksMessage;
setupSpecialThanks(totalPosts);  
document.querySelector(".topRankingArea").style.visibility = "visible";
document.querySelector(".bottomRankingArea").style.visibility = "visible";
})
.catch(err => {
  alert("ランキング読み込みエラー");
  console.log(err);
});

function setupSpecialThanks(totalPosts) {
  const btn = document.getElementById("specialThanksBtn");
  const img = document.getElementById("specialThanksImage");
  const text = document.getElementById("specialThanksText");

  if (!btn || !img || !text) {
    console.log("Special Thanks部品が見つかりません");
    return;
  }

  let milestone = Math.floor(totalPosts / 100) * 100;

  if (milestone < 100) {
    const next = 100;

    img.src = "images/special-thanks-lock.png";
    text.innerHTML = `❤Special Thanks❤<br>${next}投稿まで<br>あと${next - totalPosts}投稿`;

    btn.classList.add("locked");
    btn.onclick = null;
    return;
  }

  while (localStorage.getItem("specialThanks_" + milestone) && milestone <= totalPosts) {
    milestone += 100;
  }

  if (milestone > totalPosts) {
    img.src = "images/special-thanks-lock.png";
    text.innerHTML = `❤Special Thanks❤<br>${milestone}投稿まで<br>あと${milestone - totalPosts}投稿`;

    btn.classList.add("locked");
    btn.onclick = null;
    return;
  }

  img.src = "images/special-thanks-open.png";
  text.innerHTML = `❤Special Thanks❤<br>🎉${milestone}投稿達成🎉<br>押して祝福する✨`;

  btn.classList.remove("locked");

  btn.onclick = function() {
    localStorage.setItem("specialThanks_" + milestone, "done");
    showSpecialThanksEffect(milestone);
    setupSpecialThanks(totalPosts);
  };
}

function showSpecialThanksEffect(milestone) {
  alert(`🎉${milestone}投稿達成おめでとうございます🎉`);
}
  
</script>
  
</body>
</html>
