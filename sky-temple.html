<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天空の神殿</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: linear-gradient(#dff7ff, #ffffff, #e9fbff);
  color: #245b45;
  text-align: center;
  padding: 24px 12px;
}

.temple {
  max-width: 760px;
  margin: 0 auto;
  background: rgba(255,255,255,0.9);
  border-radius: 28px;
  padding: 26px 18px 30px;
  box-shadow:
    0 0 25px rgba(120,180,255,0.35),
    0 0 55px rgba(255,255,255,0.9);
}

.clouds {
  font-size: 24px;
  letter-spacing: 4px;
  margin-bottom: 8px;
}

h1 {
  font-size: 36px;
  margin: 8px 0 12px;
  color: #245b45;
}

.mainTitle {
  font-size: 25px;
  font-weight: 900;
  line-height: 1.5;
  margin: 18px 0 8px;
}

.lead {
  font-size: 20px;
  font-weight: bold;
  line-height: 1.8;
  margin-bottom: 22px;
}

.member {
  background: white;
  border-radius: 22px;
  margin: 18px auto;
  padding: 20px 14px;
  max-width: 560px;
  box-shadow:
    0 4px 14px rgba(0,0,0,0.12),
    0 0 18px rgba(180,220,255,0.35);
  font-size: 22px;
  font-weight: 900;
  line-height: 1.6;
}

.medal {
  font-size: 34px;
  display: block;
  margin-bottom: 4px;
}

.backButton {
  display: inline-block;
  margin-top: 26px;
  padding: 14px 26px;
  border-radius: 999px;
  background: #e8fff1;
  color: #256b3b;
  text-decoration: none;
  font-weight: 900;
  font-size: 18px;
  border: 2px solid #9fd8b2;
}
</style>
</head>

<body>

<div class="temple">

  <div class="clouds">☁️ ☁️ ☁️</div>

  <h1>🏛️天空の神殿🏛️</h1>

  <div class="clouds">✨ ☁️ ✨</div>

  <div class="mainTitle">
    🌈宝物を届けてくれた人たち🌈
  </div>

  <p class="lead">
    天空の神殿には<br>
    日本中へ素敵な宝物を届けてくれた<br>
    仲間たちの記録が刻まれています✨
  </p>

  <div class="member">
    <span class="medal">🥇</span>
    ちえちゃん<br>
    12個の宝物を届けてくれました🌸
  </div>

  <div class="member">
    <span class="medal">🥈</span>
    ○○さん<br>
    8個の宝物を届けてくれました🌱
  </div>

  <div class="member">
    <span class="medal">🥉</span>
    ○○さん<br>
    5個の宝物を届けてくれました🌈
  </div>

  <a class="backButton" href="index.html?return=true">🌎宝物地図へ戻る</a>

</div>

</body>
</html>
