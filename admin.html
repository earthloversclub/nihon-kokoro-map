<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>管理者投稿ページ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
body { margin:0; font-family:sans-serif; background:#f7f7f7; }
h2 { text-align:center; color:#256b3b; }
#map { height: calc(100vh - 60px); width: 100%; }
#formBox { position: absolute; top: 120px; right: 25px; z-index: 1000; background:white; padding:18px; width: 420px; border-radius: 18px; box-shadow: 0 2px 16px rgba(0,0,0,0.25); }
input, textarea, select { width:100%; margin:6px 0; padding:8px; box-sizing:border-box; }
button { background:#cdebd4; border:none; padding:12px 20px; border-radius:20px; cursor:pointer; font-weight:bold; }
.result-item { border:1px solid #ddd; padding:10px; margin:8px 0; border-radius:10px; background:#fff; }
</style>
</head>

<body>

<h2>🌈 管理者投稿ページ 🌈</h2>

<div id="map"></div>

<div id="formBox">
  <input id="secret" value="hirochietarosasu523" type="hidden">

  <input id="title" placeholder="タイトル" required>
  <textarea id="description" placeholder="感謝のメッセージや説明" rows="4" required></textarea>
  
  <input id="lat" placeholder="緯度" readonly>
  <input id="lng" placeholder="経度" readonly>
  <input id="prefecture" placeholder="都道府県">

  <input type="file" id="mediaFile" accept="image/*,video/*">

  <button onclick="submitPost()">投稿する💖</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
// 設定
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwDoo6zqlwZ-1nkPt9pD3emE0ivjlIUPG8HnLFxTKLvc2GYmAqDJfDY68ykjOPCjmcoaw/exec";

const map = L.map('map').setView([36.2, 138.2], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let currentMarker = null;

map.on("click", function(e) {
  const lat = e.latlng.lat.toFixed(6);
  const lng = e.latlng.lng.toFixed(6);
  document.getElementById("lat").value = lat;
  document.getElementById("lng").value = lng;

  if (currentMarker) map.removeLayer(currentMarker);
  currentMarker = L.marker([lat, lng]).addTo(map);
});

// ==================== 投稿送信 ====================
async function submitPost() {
  const btn = document.getElementById("submitButton");
  btn.disabled = true;
  btn.textContent = "投稿中... 💖";

  const formData = new FormData();
  formData.append('adminSecret', 'hirochietarosasu523');
  formData.append('title', document.getElementById("title").value || "無題");
  formData.append('message', document.getElementById("description").value || "");
  formData.append('lat', document.getElementById("lat").value);
  formData.append('lng', document.getElementById("lng").value);
  
  const fileInput = document.getElementById("mediaFile");
  if (fileInput.files[0]) {
    formData.append('mediaFile', fileInput.files[0]);
  }

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: formData
    });

    const text = await res.text();
    alert("返事：" + text);   // ← これで何が起きているかわかる

    if (text.includes("成功")) {
      alert("✅ 投稿成功！ Cloudinaryに保存されました");
      // フォームをリセット
      document.getElementById("title").value = "";
      document.getElementById("description").value = "";
      document.getElementById("mediaFile").value = "";
      document.getElementById("lat").value = "";
      document.getElementById("lng").value = "";
    } else {
      alert("❌ 失敗: " + text);
    }
  } catch (err) {
    alert("通信エラー: " + err.message);
  }

  btn.disabled = false;
  btn.textContent = "投稿する";
}
</script>
</body>
</html>
