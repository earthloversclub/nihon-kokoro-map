<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>管理者投稿テスト</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f0f8f0; }
  input, textarea, button { margin: 10px 0; padding: 12px; width: 100%; font-size: 16px; }
  button { background: #4caf50; color: white; border: none; border-radius: 10px; }
</style>
</head>
<body>

<h2>シンプル投稿テスト</h2>

<input id="title" value="テスト投稿" placeholder="タイトル"><br>
<textarea id="description" rows="3">これはテストです</textarea><br>
<input id="lat" value="43.7334" placeholder="緯度"><br>
<input id="lng" value="142.5586" placeholder="経度"><br>
<input type="file" id="mediaFile"><br><br>

<button onclick="submitTest()">投稿テスト実行</button>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_pMRDZAqCAAdtpdcYk47TwS__buHZhAWcGEHH2A4AwWkr2oyz_p5zcXIh7fGbx5RVJw/exec";

async function submitTest() {
  console.log("✅ ボタンが押されました");

  const formData = new FormData();
  formData.append('adminSecret', 'hirochietarosasu523');
  formData.append('title', document.getElementById("title").value);
  formData.append('message', document.getElementById("description").value);
  formData.append('lat', document.getElementById("lat").value);
  formData.append('lng', document.getElementById("lng").value);

  const file = document.getElementById("mediaFile").files[0];
  if (file) {
    console.log("📎 ファイルあり:", file.name);
    formData.append('mediaFile', file);
  }

  try {
    console.log("🚀 送信開始...");
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: formData
    });
    const text = await res.text();
    console.log("📥 返事:", text);
    alert("サーバーからの返事:\n" + text);
  } catch (err) {
    console.error("❌ エラー:", err);
    alert("エラー発生: " + err.message);
  }
}
</script>
</body>
</html>
