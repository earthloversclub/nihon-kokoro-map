<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>管理者投稿ページ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f7f7f7;
}

h2{
  text-align:center;
  color:#256b3b;
}

#map{
  height:500px;
}

#formBox{
  background:white;
  padding:20px;
}

input, textarea, select{
  width:100%;
  margin:6px 0;
  padding:8px;
  box-sizing:border-box;
}

button{
  background:#cdebd4;
  border:none;
  padding:12px 20px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>🌈 管理者投稿ページ 🌈</h2>

<div id="map"></div>

<div id="formBox">

<input id="secret" value="chie-admin-key" type="hidden">
  
<input id="addressSearch" placeholder="住所・施設名で検索 例：東京タワー">
<button type="button" onclick="searchAddress()">検索してピンを立てる</button>  

<input id="lat" placeholder="緯度" readonly>
<input id="lng" placeholder="経度" readonly>

<input id="prefecture" placeholder="都道府県">

<input id="title" placeholder="タイトル">

<select id="category">
<option>温泉</option>
<option>絶景</option>
<option>グルメ</option>
<option>幸せシェア</option>
<option>動物</option>
<option>神社・伝統</option>
<option>風景</option>
<option>イベント</option>
</select>

<textarea id="description" placeholder="説明"></textarea>

<input id="poster" placeholder="投稿者">

<input id="image" placeholder="画像URL">
<input type="file" id="imageFile" accept="image/*">  

<input id="video" placeholder="動画URL">

<button onclick="submitPost()">
投稿する
</button>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const scriptUrl =
"https://script.google.com/macros/s/AKfycbyx8GxcU-C-Wz_vF1Y0JY8Hv_b4AUccKDnIuHjtW9B_DGzTOR_Q97vO6aTHvchFpx3RjA/exec";

const map = L.map('map').setView([36.2,138.2],5);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

let marker;

const prefectureMap = {
  "01":"北海道","02":"青森","03":"岩手","04":"宮城","05":"秋田","06":"山形","07":"福島",
  "08":"茨城","09":"栃木","10":"群馬","11":"埼玉","12":"千葉","13":"東京","14":"神奈川",
  "15":"新潟","16":"富山","17":"石川","18":"福井","19":"山梨","20":"長野","21":"岐阜",
  "22":"静岡","23":"愛知","24":"三重","25":"滋賀","26":"京都","27":"大阪","28":"兵庫",
  "29":"奈良","30":"和歌山","31":"鳥取","32":"島根","33":"岡山","34":"広島","35":"山口",
  "36":"徳島","37":"香川","38":"愛媛","39":"高知","40":"福岡","41":"佐賀","42":"長崎",
  "43":"熊本","44":"大分","45":"宮崎","46":"鹿児島","47":"沖縄"
};

map.on("click", function(e){

  const lat = e.latlng.lat.toFixed(6);
  const lng = e.latlng.lng.toFixed(6);

  document.getElementById("lat").value = lat;
  document.getElementById("lng").value = lng;
  document.getElementById("prefecture").value = "取得中...";

  if(marker){
    map.removeLayer(marker);
  }

  marker = L.marker([lat,lng]).addTo(map);

  fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${lat}&lon=${lng}`)
    .then(res => res.json())
    .then(data => {
      const muniCd = data.results.muniCd;
      const prefCode = muniCd.substring(0, 2);
      const prefName = prefectureMap[prefCode];

      if(prefName){
        document.getElementById("prefecture").value = prefName;
      } else {
        document.getElementById("prefecture").value = "";
      }
    })
    .catch(() => {
      document.getElementById("prefecture").value = "";
      alert("都道府県の自動取得に失敗しました");
    });

});

function submitPost(){

const file = document.getElementById("imageFile").files[0];

const data = {
secret: document.getElementById("secret").value,
category: document.getElementById("category").value,
prefecture: document.getElementById("prefecture").value,
title: document.getElementById("title").value,
description: document.getElementById("description").value,
lat: document.getElementById("lat").value,
lng: document.getElementById("lng").value,
image: document.getElementById("image").value,
image2: "",
image3: "",
image4: "",
video: document.getElementById("video").value,
poster: document.getElementById("poster").value,
uploadImage: null
};

if(file){
  const reader = new FileReader();

  reader.onload = function(){
    data.uploadImage = {
      fileName: file.name,
      mimeType: file.type,
      base64: reader.result.split(",")[1]
    };

    sendPost(data);
  };

  reader.readAsDataURL(file);
} else {
  sendPost(data);
}

}

function sendPost(data){

fetch(scriptUrl,{
method:"POST",
body:JSON.stringify(data)
})
.then(r=>r.json())
.then(res=>{

if(res.success){
alert("投稿成功🌈");
}else{
alert("失敗：" + res.message);
}

})
.catch(err=>{
alert("送信エラー\n\n" + err + "\n\n画像が大きすぎる可能性があります");
console.log(err);
});

}

function searchAddress(){

  const keyword = document.getElementById("addressSearch").value.trim();

  if(!keyword){
    alert("住所か施設名を入力してね");
    return;
  }

  fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(keyword))
    .then(res => res.json())
    .then(results => {

      if(results.length > 0){
        const lng = results[0].geometry.coordinates[0];
        const lat = results[0].geometry.coordinates[1];

        map.setView([lat, lng], 15);

        map.fire("click", {
          latlng: L.latLng(lat, lng)
        });

        return;
      }

      return fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q=" + encodeURIComponent(keyword))
        .then(res => res.json())
        .then(results => {

          if(results.length === 0){
            alert("場所が見つかりませんでした");
            return;
          }

          const lat = Number(results[0].lat);
          const lng = Number(results[0].lon);

          map.setView([lat, lng], 15);

          map.fire("click", {
            latlng: L.latLng(lat, lng)
          });

        });

    })
    .catch(() => {
      alert("住所検索に失敗しました");
    });

}
  
</script>

</body>
</html>
