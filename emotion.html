<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💗心の宝箱💗</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#fff0f6; color:#333; text-align:center; }
    header { padding:20px; background:#ffd6ec; font-size:26px; font-weight:bold; color:#7a3f9d; }
    .main { padding:30px 15px; }
    .island { 
      background:white; margin:12px auto; padding:18px; max-width:380px; 
      border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.1);
      font-size:22px; font-weight:bold; text-decoration:none; color:inherit;
    }
  </style>
</head>
<body>

<header>💗心の宝箱💗</header>

<div class="main">
  <h2>読み込み中...</h2>
  <div id="status">シートからデータを取得しています</div>
</div>

<script>
const heartCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v40CNsKzTus67itmVJ4NY45nYz_QLW400WRXj9XjDkM/pub?gid=247430186&single=true&output=csv";

fetch(heartCsvUrl + "&t=" + Date.now())
  .then(r => {
    if (!r.ok) throw new Error("シートにアクセスできません");
    return r.text();
  })
  .then(csv => {
    console.log("✅ CSV取得成功");
    document.querySelector("h2").textContent = "取得完了！";
    document.getElementById("status").innerHTML = "心の宝箱のページが正常に読み込まれました<br><br><a href='heart.html' style='color:blue;'>もう一度読み込み</a>";
  })
  .catch(err => {
    console.error(err);
    document.getElementById("status").innerHTML = 
      "❌ 読み込み失敗<br><br>シートが公開設定になっていない可能性があります";
  });
</script>
</body>
</html>
