<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏝感動の島🏝</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(180deg, #fff7fb, #eafff7);
      color: #2f5f3a;
      text-align: center;
    }

    header {
      padding: 18px 10px;
      background: #e9f8ef;
      font-size: 24px;
      font-weight: bold;
      color: #256b3b;
      line-height: 1.5;
    }

    .main {
      padding: 28px 15px;
      max-width: 760px;
      margin: 0 auto;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .message {
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .treasureCard {
      background: white;
      border: 3px solid #ffd6ec;
      border-radius: 24px;
      padding: 18px;
      margin: 0 auto 28px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      text-align: left;
    }

    .treasureCard h2 {
      text-align: center;
      color: #256b3b;
      margin-top: 0;
    }

    .treasureCard img {
      width: 100%;
      max-width: 420px;
      display: block;
      margin: 12px auto;
      border-radius: 16px;
    }

    .text {
      font-size: 16px;
      line-height: 1.8;
      color: #333;
    }

    .buttonArea {
      margin-top: 28px;
    }

    .backButton {
      display: inline-block;
      padding: 12px 22px;
      margin: 6px;
      background: #dff3e5;
      color: #256b3b;
      border-radius: 999px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.18);
    }
  </style>
</head>

<body>

<header>
  🏝感動の島🏝<br>
  🌈心が震えた宝物たち🌈
</header>

<div class="main">

  <div class="title">感動の島へようこそ</div>

  <div class="message">
    ここは、本・言葉・人の想いなど、<br>
    心が動いた宝物を集める島です。
  </div>

  <div class="treasureCard">
    <h2>📖 アナスタシア</h2>

    <!-- 画像を入れる時は、下の src をあとで差し替える -->
    <!-- <img src="images/anastasia.jpg" alt="アナスタシア"> -->

    <div class="text">
      自分が進化したい、変化したいと思いつつ…<br>
      なかなか歓喜する事も出来なくて、停滞しているような気持ちがかなり長く続いていました。<br><br>

      最近読みだした本で、人間の想像以上の無限の可能性に胸がいっぱいになっています✨
    </div>
  </div>

  <div class="buttonArea">
    <a class="backButton" href="heart.html">💗心の宝箱へ戻る</a>
    <a class="backButton" href="index.html">🌎宝物地図へ戻る</a>
  </div>

</div>

</body>
</html>
