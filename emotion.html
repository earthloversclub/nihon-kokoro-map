<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏝感動の島🏝</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(180deg, #fff7fb, #eafff7);
      color: #2f5f3a;
      text-align: center;
    }

    header {
      padding: 18px 10px;
      background: #e9f8ef;
      font-size: 24px;
      font-weight: bold;
      color: #256b3b;
      line-height: 1.5;
    }

    .main {
      padding: 28px 15px;
      max-width: 760px;
      margin: 0 auto;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .message {
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .treasureCard {
      background: white;
      border: 3px solid #ffd6ec;
      border-radius: 24px;
      padding: 18px;
      margin: 0 auto 28px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      text-align: left;
    }

    .treasureCard h2 {
      text-align: center;
      color: #256b3b;
      margin-top: 0;
    }

    .treasureCard img {
      width: 100%;
      max-width: 420px;
      display: block;
      margin: 12px auto;
      border-radius: 16px;
    }

    .text {
      font-size: 16px;
      line-height: 1.8;
      color: #333;
    }

    .buttonArea {
      margin-top: 28px;
    }

    .backButton {
      display: inline-block;
      padding: 12px 22px;
      margin: 6px;
      background: #dff3e5;
      color: #256b3b;
      border-radius: 999px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.18);
    }
  </style>
</head>

<body>

<header>
  🏝感動の島🏝<br>
  🌈心が震えた宝物たち🌈
</header>

<div class="main">

  <div class="title">感動の島へようこそ</div>

  <div class="message">
    ここは、本・言葉・人の想いなど、<br>
    心が動いた宝物を集める島です。
  </div>

<div id="treasureList"></div>
  </div>

  <div class="buttonArea">
    <a class="backButton" href="heart.html">💗心の宝箱へ戻る</a>
    <a class="backButton" href="index.html">🌎宝物地図へ戻る</a>
  </div>

</div>

<script>
const heartCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcio7JJ0K_QHu4SnBsdge-HEsqytJZP2ps-v40CNsKzTus67itmVJ4NY45nYz_QLW400WRXj9XjDkM/pub?gid=247430186&single=true&output=csv";

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', quote = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];

    if (c === '"' && quote && next === '"') {
      cell += '"';
      i++;
    } else if (c === '"') {
      quote = !quote;
    } else if (c === ',' && !quote) {
      row.push(cell);
      cell = '';
    } else if ((c === '\n' || c === '\r') && !quote) {
      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = '';
      }
      if (c === '\r' && next === '\n') i++;
    } else {
      cell += c;
    }
  }

  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

fetch(heartCsvUrl + "&t=" + Date.now())
  .then(response => response.text())
  .then(csv => {
    const rows = parseCSV(csv);
    const headers = rows[0];
    const list = document.getElementById("treasureList");

    rows.slice(1).forEach(row => {
      const data = {};
      headers.forEach((h, i) => data[h] = row[i]);

      if (data["表示"] !== "表示") return;
      if (data["島カテゴリ"] !== "🏝感動の島") return;

      list.innerHTML += `
        <div class="treasureCard">
          <h2>${data["タイトル"] || ""}</h2>

          <div class="poster">
            投稿者：${data["投稿者"] || "匿名さん"}
          </div>

          ${data["画像"] ? `<img src="${data["画像"]}" alt="">` : ""}

          <div class="text">
            ${(data["本文"] || "").replace(/\n/g, "<br>")}
          </div>
        </div>
      `;
    });

    if (!list.innerHTML.trim()) {
      list.innerHTML = `<div class="message">まだ感動の宝物はありません🌱</div>`;
    }
  });
</script>
  
</body>
</html>
